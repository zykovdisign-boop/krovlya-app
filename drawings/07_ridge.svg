<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330"><title>Три узла в коньке: подпирают конёк, в стык с коньком, опираются на конёк</title><defs><pattern id="concrete" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#e6e2da"/><circle cx="3" cy="4" r="1" fill="#9a958b"/><circle cx="10" cy="9" r="1.3" fill="#9a958b"/><path d="M7 2 l2 2 -2.5 .5z" fill="#9a958b"/></pattern><pattern id="block" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#f1eee8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#b9b3a7" stroke-width="1"/></pattern><pattern id="wood" width="40" height="8" patternUnits="userSpaceOnUse"><rect width="40" height="8" fill="#c99a5b"/><path d="M0 4 q10 -2 20 0 t20 0" fill="none" stroke="#a87b40" stroke-width=".7"/></pattern><pattern id="woodx" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#c99a5b"/><path d="M0 8 L8 0" stroke="#a87b40" stroke-width=".7"/></pattern><pattern id="hydro" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#2f2f2f"/></pattern></defs><text x="135.0" y="34.0" font-family="'PT Sans', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#1d1d1b" text-anchor="middle">Подпирают конёк</text><rect x="127.0" y="61.0" width="16.0" height="74.0" rx="0" fill="url(#woodx)" stroke="#1d1d1b" stroke-width="1.3"/><polygon points="23.0,228.4 135.0,150.0 135.0,135.0 127.0,135.0 127.0,119.0 23.0,191.8" fill="url(#wood)" stroke="#1d1d1b" stroke-width="1.2" stroke-linejoin="round"/><polygon points="247.0,228.4 135.0,150.0 135.0,135.0 143.0,135.0 143.0,119.0 247.0,191.8" fill="url(#wood)" stroke="#1d1d1b" stroke-width="1.2" stroke-linejoin="round"/><line x1="135.0" y1="52.0" x2="135.0" y2="290.0" stroke="#8a8780" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="8 3 2 3"/><text x="135.0" y="314.0" font-family="'PT Sans', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#8a8780" text-anchor="middle">гнездо сверху, доска на ребре</text><text x="400.0" y="34.0" font-family="'PT Sans', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#1d1d1b" text-anchor="middle">В стык с коньком</text><rect x="392.0" y="105.0" width="16.0" height="70.6" rx="0" fill="url(#woodx)" stroke="#1d1d1b" stroke-width="1.3"/><polygon points="288.0,228.4 392.0,155.6 392.0,119.0 288.0,191.8" fill="url(#wood)" stroke="#1d1d1b" stroke-width="1.2" stroke-linejoin="round"/><polygon points="512.0,228.4 408.0,155.6 408.0,119.0 512.0,191.8" fill="url(#wood)" stroke="#1d1d1b" stroke-width="1.2" stroke-linejoin="round"/><line x1="400.0" y1="52.0" x2="400.0" y2="290.0" stroke="#8a8780" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="8 3 2 3"/><text x="400.0" y="314.0" font-family="'PT Sans', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#8a8780" text-anchor="middle">рез по отвесу в грань доски</text><text x="665.0" y="34.0" font-family="'PT Sans', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#1d1d1b" text-anchor="middle">Опираются на конёк</text><rect x="647.0" y="150.6" width="36.0" height="70.0" rx="0" fill="url(#woodx)" stroke="#1d1d1b" stroke-width="1.3"/><polygon points="553.0,228.4 647.0,162.6 647.0,150.6 665.0,150.6 665.0,113.4 553.0,191.8" fill="url(#wood)" stroke="#1d1d1b" stroke-width="1.2" stroke-linejoin="round"/><polygon points="777.0,228.4 683.0,162.6 683.0,150.6 665.0,150.6 665.0,113.4 777.0,191.8" fill="url(#wood)" stroke="#1d1d1b" stroke-width="1.2" stroke-linejoin="round"/><line x1="665.0" y1="52.0" x2="665.0" y2="290.0" stroke="#8a8780" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="8 3 2 3"/><text x="665.0" y="314.0" font-family="'PT Sans', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#8a8780" text-anchor="middle">гнездо снизу, конёк под стропилами</text></svg>