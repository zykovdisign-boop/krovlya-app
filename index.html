<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Крыша без переделок</title>
  <script>
    /* автообновление: если на сервере версия новее, перезагружаемся мимо кэша Telegram */
    window.APP_VERSION = 13;
    fetch("version.json?t=" + Date.now(), { cache: "no-store" }).then((r) => r.json()).then((j) => {
      if (j.v > window.APP_VERSION && !location.search.includes("v=" + j.v)) location.replace(location.pathname + "?v=" + j.v + location.hash);
    }).catch(() => {});
  </script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css?v=13">
</head>
<body>
  <header class="top">
    <button class="project-chip" id="projectChip" type="button">
      <span class="chip-label">Проект</span>
      <span class="chip-name" id="projectName">—</span>
    </button>
    <span class="badge" id="accessBadge">бесплатно</span>
  </header>

  <main id="view"></main>

  <nav class="tabs" id="tabs">
    <button data-tab="project" type="button"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7M5 10v10h14V10"/></svg>Проект</button>
    <button data-tab="rafter" type="button"><svg viewBox="0 0 24 24"><path d="M2 20 12 5l10 15M7 13h10"/></svg>Стропила</button>
    <button data-tab="map" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14"/><path d="M7 5v14M11 5v14M15 5v14M3 12h18"/></svg>Карта</button>
    <button data-tab="book" type="button"><svg viewBox="0 0 24 24"><path d="M4 5c3-1.5 5.5-1.5 8 0v14c-2.5-1.5-5-1.5-8 0zM12 5c2.5-1.5 5-1.5 8 0v14c-3-1.5-5.5-1.5-8 0"/></svg>Книга</button>
    <button data-tab="check" type="button"><svg viewBox="0 0 24 24"><path d="M4 6l1.5 1.5L8 5M4 12l1.5 1.5L8 11M4 18l1.5 1.5L8 17M11 6h9M11 12h9M11 18h9"/></svg>Чек-лист</button>
    <button data-tab="tips" type="button"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>Советы</button>
  </nav>

  <div class="toast" id="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="config.js?v=13"></script>
  <script src="core.js?v=13"></script>
  <script src="checklists.js?v=13"></script>
  <script src="tips.js?v=13"></script>
  <script src="app.js?v=13"></script>
</body>
</html>
