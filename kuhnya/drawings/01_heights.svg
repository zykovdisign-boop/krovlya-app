<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 640" width="820" height="640" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Высоты кухни</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d1d1b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ece7dd"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc8bb" stroke-width="2"/></pattern><pattern id="dsp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="#d7ccc8"/><line x1="0" y1="0" x2="0" y2="6" stroke="#bcaaa4" stroke-width="1"/></pattern></defs><rect width="820" height="640" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#1d1d1b">Высоты кухни</text><rect x="120" y="70" width="30" height="544" rx="0" fill="url(#hatch)" stroke="#1d1d1b" stroke-width="1.5"/><rect x="120" y="600" width="440" height="14" rx="0" fill="url(#hatch)" stroke="#1d1d1b" stroke-width="1.5"/><rect x="174" y="571.6" width="12" height="20.400000000000002" rx="0" fill="#90a4ae" stroke="#1d1d1b" stroke-width="1.2"/><rect x="169" y="592" width="22" height="8" rx="0" fill="#607d8b" stroke="#1d1d1b" stroke-width="1.2"/><rect x="239" y="571.6" width="12" height="20.400000000000002" rx="0" fill="#90a4ae" stroke="#1d1d1b" stroke-width="1.2"/><rect x="234" y="592" width="22" height="8" rx="0" fill="#607d8b" stroke="#1d1d1b" stroke-width="1.2"/><rect x="252" y="571.6" width="6" height="26.400000000000002" rx="0" fill="#90a4ae" stroke="#1d1d1b" stroke-width="1"/><rect x="150" y="427.6" width="112" height="144" rx="0" fill="#fafafa" stroke="#1d1d1b" stroke-width="2"/><rect x="262" y="427.6" width="5.4" height="144" rx="0" fill="#eceff1" stroke="#1d1d1b" stroke-width="1.5"/><rect x="150" y="420" width="120" height="7.6000000000000005" rx="0" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="1.5"/><rect x="150" y="156" width="60" height="144" rx="0" fill="#fafafa" stroke="#1d1d1b" stroke-width="2"/><rect x="210" y="156" width="5.4" height="144" rx="0" fill="#eceff1" stroke="#1d1d1b" stroke-width="1.5"/><line x1="120" y1="60" x2="560" y2="60" stroke="#6f6c66" stroke-width="1.5" stroke-dasharray="6 4"/><text x="560" y="54" font-size="12" font-weight="400" text-anchor="end" fill="#6f6c66">потолок</text><line x1="270" y1="571.6" x2="340" y2="571.6" stroke="#6f6c66" stroke-width="0.8" stroke-dasharray="3 3"/><line x1="330" y1="600" x2="330" y2="571.6" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="338" y="590.8" font-size="14" font-weight="700" text-anchor="start" fill="#1d1d1b">цоколь 100–150</text><line x1="270" y1="420" x2="340" y2="420" stroke="#6f6c66" stroke-width="0.8" stroke-dasharray="3 3"/><line x1="330" y1="571.6" x2="330" y2="420" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="338" y="500.8" font-size="14" font-weight="700" text-anchor="start" fill="#1d1d1b">столешница 850–910 от пола</text><line x1="270" y1="300" x2="340" y2="300" stroke="#6f6c66" stroke-width="0.8" stroke-dasharray="3 3"/><line x1="330" y1="420" x2="330" y2="300" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="338" y="365" font-size="14" font-weight="700" text-anchor="start" fill="#1d1d1b">фартук 550–650</text><line x1="270" y1="156" x2="340" y2="156" stroke="#6f6c66" stroke-width="0.8" stroke-dasharray="3 3"/><line x1="330" y1="300" x2="330" y2="156" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="338" y="233" font-size="14" font-weight="700" text-anchor="start" fill="#1d1d1b">верхние 720 / 900 / 960</text><line x1="150" y1="408" x2="270" y2="408" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="210" y="400" font-size="12" font-weight="700" text-anchor="middle" fill="#1d1d1b">600</text><text x="206" y="499.6" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66" transform="rotate(-90 206 499.6)">корпус 720</text><text x="180" y="228" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66">300</text><text x="560" y="120" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Как выбрать высоту столешницы:</text><text x="560" y="138" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">рост 150–160 см — 850–870 мм</text><text x="560" y="156" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">рост 160–175 см — 880–900 мм</text><text x="560" y="174" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">рост 175–185 см — 900–910 мм</text><text x="560" y="192" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Проверка локтем: от согнутого локтя</text><text x="560" y="210" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">до столешницы 10–15 см.</text><text x="560" y="290" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Вытяжка от столешницы:</text><text x="560" y="308" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">над электро и индукцией — от 650 мм</text><text x="560" y="326" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">над газом — от 750 мм</text><text x="560" y="344" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b"></text><text x="560" y="362" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Розетки над столешницей: 150–250 мм</text><text x="560" y="380" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">выше неё, не над мойкой и плитой.</text><text x="560" y="470" font-size="13" font-weight="400" text-anchor="start" fill="#6f6c66">Ножки регулируются на 20–40 мм,</text><text x="560" y="488" font-size="13" font-weight="400" text-anchor="start" fill="#6f6c66">поэтому цоколь 100–150 мм</text><text x="560" y="506" font-size="13" font-weight="400" text-anchor="start" fill="#6f6c66">закрывает любой кривой пол.</text></svg>