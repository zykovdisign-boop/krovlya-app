<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600" width="860" height="600" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Навеска верхних на шину</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d1d1b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ece7dd"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc8bb" stroke-width="2"/></pattern><pattern id="dsp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="#d7ccc8"/><line x1="0" y1="0" x2="0" y2="6" stroke="#bcaaa4" stroke-width="1"/></pattern></defs><rect width="860" height="600" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#1d1d1b">Навеска верхних на шину</text><rect x="100" y="70" width="30" height="400" rx="0" fill="url(#hatch)" stroke="#1d1d1b" stroke-width="1.5"/><path d="M130 120h22v40h-8v-30h-14z" fill="#b0bec5" stroke="#1d1d1b" stroke-width="2"/><circle cx="175" cy="112" r="11" fill="#1d1d1b"/><text x="175" y="117" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">1</text><rect x="124" y="150" width="16" height="6" rx="0" fill="#795548" stroke="#1d1d1b" stroke-width="1"/><rect x="160" y="135" width="150" height="300" rx="0" fill="#fafafa" stroke="#1d1d1b" stroke-width="2"/><rect x="310" y="135" width="12" height="300" rx="0" fill="#eceff1" stroke="#1d1d1b" stroke-width="1.5"/><path d="M162 140h28v34h-14v-8h6v-18h-20z" fill="#78909c" stroke="#1d1d1b" stroke-width="1.5"/><circle cx="205" cy="185" r="11" fill="#1d1d1b"/><text x="205" y="190" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">2</text><path d="M144 132q4 -12 10 0" fill="none" stroke="#d84315" stroke-width="2.5"/><line x1="214" y1="220" x2="214" y2="245" stroke="#1565c0" stroke-width="1.6" marker-end="url(#ar)"/><line x1="214" y1="245" x2="214" y2="220" stroke="#1565c0" stroke-width="1.6" marker-end="url(#ar)"/><text x="222" y="238" font-size="12" font-weight="400" text-anchor="start" fill="#1565c0">винт высоты</text><line x1="176" y1="270" x2="150" y2="270" stroke="#1565c0" stroke-width="1.6" marker-end="url(#ar)"/><line x1="150" y1="270" x2="176" y2="270" stroke="#1565c0" stroke-width="1.6" marker-end="url(#ar)"/><text x="182" y="274" font-size="12" font-weight="400" text-anchor="start" fill="#1565c0">винт прижима к стене</text><line x1="360" y1="70" x2="360" y2="135" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="368" y="107.5" font-size="14" font-weight="700" text-anchor="start" fill="#1d1d1b">≥ 30 мм до потолка</text><line x1="130" y1="70" x2="400" y2="70" stroke="#6f6c66" stroke-width="1.5" stroke-dasharray="6 4"/><text x="40" y="520" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">1 — шина монтажная, ставится по лазеру от линии верха шкафов, а не от пола.</text><text x="40" y="538" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">2 — навес в верхнем углу боковины: шкаф цепляют за шину и выставляют двумя винтами.</text><text x="40" y="556" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Сверху нужен запас, чтобы приподнять шкаф и завести крюк. Пенал выравнивают по той же линии.</text><text x="660" y="80" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1d1b">Вид спереди</text><rect x="530" y="130" width="300" height="12" rx="0" fill="#b0bec5" stroke="#1d1d1b" stroke-width="2"/><circle cx="550" cy="136" r="4" fill="#795548"/><circle cx="620" cy="136" r="4" fill="#795548"/><circle cx="690" cy="136" r="4" fill="#795548"/><circle cx="760" cy="136" r="4" fill="#795548"/><circle cx="810" cy="136" r="4" fill="#795548"/><rect x="530" y="150" width="148" height="200" rx="0" fill="#fafafa" stroke="#1d1d1b" stroke-width="2"/><rect x="682" y="150" width="148" height="200" rx="0" fill="#fafafa" stroke="#1d1d1b" stroke-width="2"/><line x1="550" y1="118" x2="620" y2="118" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="585" y="110" font-size="12" font-weight="700" text-anchor="middle" fill="#1d1d1b">300–400</text><text x="530" y="380" font-size="13" font-weight="400" text-anchor="start" fill="#6f6c66">Анкеры 8×80 через 300–400 мм.</text><text x="530" y="398" font-size="13" font-weight="400" text-anchor="start" fill="#6f6c66">Стяжки между шкафами — 2 на стык.</text><text x="530" y="416" font-size="13" font-weight="400" text-anchor="start" fill="#6f6c66">Шина одна на всю стену: шкафы встают</text><text x="530" y="434" font-size="13" font-weight="400" text-anchor="start" fill="#6f6c66">в одну линию без подгонки.</text></svg>