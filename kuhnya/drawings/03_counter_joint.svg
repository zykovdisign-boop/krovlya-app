<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 590" width="820" height="590" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Стыки столешницы</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d1d1b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ece7dd"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc8bb" stroke-width="2"/></pattern><pattern id="dsp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="#d7ccc8"/><line x1="0" y1="0" x2="0" y2="6" stroke="#bcaaa4" stroke-width="1"/></pattern></defs><rect width="820" height="590" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#1d1d1b">Стыки столешницы</text><text x="200" y="80" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1d1b">Через соединительную планку</text><text x="600" y="80" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1d1b">Евро-запил</text><line x1="400" y1="60" x2="400" y2="470" stroke="#e0dcd3" stroke-width="1.5"/><line x1="40" y1="110" x2="360" y2="110" stroke="#455a64" stroke-width="6"/><line x1="360" y1="110" x2="360" y2="440" stroke="#455a64" stroke-width="6"/><rect x="60" y="110" width="300" height="110" rx="0" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="2"/><rect x="250" y="220" width="110" height="200" rx="0" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="2"/><rect x="250" y="218" width="110" height="6" rx="0" fill="#b0bec5" stroke="#1d1d1b" stroke-width="1.2"/><line x1="200" y1="260" x2="250" y2="222" stroke="#1d1d1b" stroke-width="1.6" marker-end="url(#ar)"/><text x="196" y="266" font-size="13" font-weight="400" text-anchor="end" fill="#1d1d1b">планка</text><text x="160" y="170" font-size="13" font-weight="400" text-anchor="middle" fill="#1d1d1b">кусок 1 — до стены</text><text x="305" y="330" font-size="13" font-weight="400" text-anchor="middle" fill="#1d1d1b" transform="rotate(-90 305 330)">кусок 2</text><text x="40" y="455" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Кусок 2 короче на глубину столешницы.</text><text x="40" y="473" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Просто, ровно, без фрезера.</text><line x1="440" y1="110" x2="760" y2="110" stroke="#455a64" stroke-width="6"/><line x1="760" y1="110" x2="760" y2="440" stroke="#455a64" stroke-width="6"/><path d="M460 110H760V220H660Q650 220 648 210L640 110" fill="none"/><path d="M460 110H650V200Q650 220 670 220H760V110z" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="2" opacity="0"/><path d="M460 110H760V420H650V232Q650 220 638 220H460z" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="2"/><path d="M650 420V232Q650 220 638 220H460" fill="none" stroke="#d84315" stroke-width="2.5"/><path d="M460 220h12M460 220" stroke="#1d1d1b"/><rect x="592" y="210" width="16" height="8" rx="0" fill="#78909c" stroke="#1d1d1b" stroke-width="1"/><rect x="647" y="296" width="16" height="8" rx="0" fill="#78909c" stroke="#1d1d1b" stroke-width="1"/><rect x="647" y="366" width="16" height="8" rx="0" fill="#78909c" stroke="#1d1d1b" stroke-width="1"/><line x1="560" y1="280" x2="600" y2="222" stroke="#1d1d1b" stroke-width="1.6" marker-end="url(#ar)"/><text x="556" y="290" font-size="13" font-weight="400" text-anchor="end" fill="#1d1d1b">стяжки, 3 шт</text><line x1="720" y1="470" x2="652" y2="400" stroke="#d84315" stroke-width="1.6" marker-end="url(#ar)"/><text x="560" y="485" font-size="13" font-weight="400" text-anchor="start" fill="#d84315">рез повторяет закругление кромки</text><text x="440" y="510" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Оба куска до стены. Нужен шаблон и фреза</text><text x="440" y="528" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">с подшипником, иначе будет щель.</text><text x="40" y="560" font-size="13" font-weight="400" text-anchor="start" fill="#6f6c66">Стык никогда не над посудомойкой, мойкой и варочной. Торцы перед стяжкой — в силикон или герметик для столешниц.</text></svg>