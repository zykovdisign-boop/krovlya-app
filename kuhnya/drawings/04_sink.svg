<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Врезка мойки</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d1d1b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ece7dd"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc8bb" stroke-width="2"/></pattern><pattern id="dsp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="#d7ccc8"/><line x1="0" y1="0" x2="0" y2="6" stroke="#bcaaa4" stroke-width="1"/></pattern></defs><rect width="820" height="440" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#1d1d1b">Врезка мойки</text><text x="200" y="80" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1d1b">Вид сверху</text><text x="600" y="80" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1d1b">Разрез</text><line x1="40" y1="110" x2="360" y2="110" stroke="#455a64" stroke-width="6"/><rect x="40" y="110" width="320" height="150" rx="0" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="2"/><rect x="110" y="135" width="200" height="100" rx="14" fill="#e3f2fd" stroke="#1d1d1b" stroke-width="2"/><line x1="330" y1="110" x2="330" y2="135" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="338" y="127.5" font-size="12" font-weight="700" text-anchor="start" fill="#1d1d1b">≥ 50</text><line x1="330" y1="235" x2="330" y2="260" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="338" y="252.5" font-size="12" font-weight="700" text-anchor="start" fill="#1d1d1b">50–80</text><line x1="40" y1="285" x2="110" y2="285" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="75" y="277" font-size="12" font-weight="700" text-anchor="middle" fill="#1d1d1b">≥ 100 до стыка</text><text x="210" y="190" font-size="13" font-weight="400" text-anchor="middle" fill="#1d1d1b">вырез по шаблону</text><text x="40" y="330" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Отступ от переднего края нужен, чтобы</text><text x="40" y="348" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">столешница не треснула у кромки.</text><text x="40" y="366" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Ось мойки — по центру шкафа под ней.</text><rect x="450" y="200" width="120" height="26" rx="0" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="2"/><rect x="670" y="200" width="120" height="26" rx="0" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="2"/><rect x="540" y="192" width="160" height="6" rx="0" fill="#cfd8dc" stroke="#1d1d1b" stroke-width="2"/><path d="M578 198V284q0 16 16 16h52q16 0 16 -16V198" fill="#eceff1" stroke="#1d1d1b" stroke-width="2.5"/><rect x="540" y="198" width="30" height="2" rx="0" fill="#1565c0" stroke="#1565c0" stroke-width="1.5"/><rect x="670" y="198" width="30" height="2" rx="0" fill="#1565c0" stroke="#1565c0" stroke-width="1.5"/><line x1="500" y1="160" x2="550" y2="196" stroke="#1565c0" stroke-width="1.6" marker-end="url(#ar)"/><text x="496" y="156" font-size="13" font-weight="400" text-anchor="end" fill="#1565c0">силикон под борт</text><rect x="567" y="200" width="3" height="26" rx="0" fill="#d84315" stroke="#d84315" stroke-width="1"/><rect x="670" y="200" width="3" height="26" rx="0" fill="#d84315" stroke="#d84315" stroke-width="1"/><line x1="520" y1="290" x2="566" y2="220" stroke="#d84315" stroke-width="1.6" marker-end="url(#ar)"/><text x="516" y="300" font-size="13" font-weight="400" text-anchor="end" fill="#d84315">торец выреза в силикон</text><path d="M578 236h-24v-10" fill="none" stroke="#546e7a" stroke-width="3.5"/><line x1="720" y1="300" x2="562" y2="238" stroke="#1d1d1b" stroke-width="1.6" marker-end="url(#ar)"/><text x="724" y="304" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">прижим</text><text x="450" y="370" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Прижимы тяните по кругу, понемногу:</text><text x="450" y="388" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">перетянете один — борт поведёт.</text></svg>