<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Вырез под варочную</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d1d1b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ece7dd"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc8bb" stroke-width="2"/></pattern><pattern id="dsp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="#d7ccc8"/><line x1="0" y1="0" x2="0" y2="6" stroke="#bcaaa4" stroke-width="1"/></pattern></defs><rect width="820" height="440" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#1d1d1b">Вырез под варочную</text><text x="200" y="80" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1d1b">Вид сверху</text><text x="600" y="80" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1d1b">Разрез</text><line x1="40" y1="110" x2="360" y2="110" stroke="#455a64" stroke-width="6"/><rect x="40" y="110" width="320" height="150" rx="0" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="2"/><rect x="90" y="130" width="220" height="110" rx="4" fill="#424242" stroke="#1d1d1b" stroke-width="2"/><text x="200" y="192" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">560 × 490</text><line x1="335" y1="110" x2="335" y2="130" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="343" y="125" font-size="12" font-weight="700" text-anchor="start" fill="#1d1d1b">≥ 50</text><line x1="40" y1="285" x2="90" y2="285" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="65" y="277" font-size="12" font-weight="700" text-anchor="middle" fill="#1d1d1b">≥ 50</text><line x1="310" y1="285" x2="360" y2="285" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="335" y="277" font-size="12" font-weight="700" text-anchor="middle" fill="#1d1d1b">≥ 50</text><text x="40" y="330" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Размер выреза — из паспорта панели,</text><text x="40" y="348" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">обычно 560×490 для 60 см и 270×490</text><text x="40" y="366" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">для домино. Углы сверлите сверлом 10 мм.</text><rect x="430" y="200" width="110" height="30" rx="0" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="2"/><rect x="680" y="200" width="110" height="30" rx="0" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="2"/><rect x="526" y="192" width="168" height="8" rx="0" fill="#212121" stroke="#1d1d1b" stroke-width="1"/><rect x="540" y="200" width="140" height="44" rx="0" fill="#616161" stroke="#1d1d1b" stroke-width="1.5"/><rect x="526" y="198" width="14" height="4" rx="0" fill="#1565c0" stroke="#1565c0" stroke-width="0.5"/><rect x="680" y="198" width="14" height="4" rx="0" fill="#1565c0" stroke="#1565c0" stroke-width="0.5"/><line x1="470" y1="160" x2="532" y2="196" stroke="#1565c0" stroke-width="1.6" marker-end="url(#ar)"/><text x="466" y="156" font-size="13" font-weight="400" text-anchor="end" fill="#1565c0">уплотнитель</text><rect x="430" y="290" width="360" height="10" rx="0" fill="#eceff1" stroke="#1d1d1b" stroke-width="1.5"/><text x="610" y="320" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66">ящик или полка</text><line x1="720" y1="244" x2="720" y2="290" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="728" y="272" font-size="12" font-weight="700" text-anchor="start" fill="#1d1d1b">≥ 20 мм воздуха</text><text x="430" y="370" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Индукции нужен воздух снизу: щель</text><text x="430" y="388" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">под панелью и вырез в задней стенке.</text><text x="430" y="406" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Над духовкой — зазор, как в паспорте.</text></svg>