<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 570" width="820" height="570" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Цоколь</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d1d1b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ece7dd"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc8bb" stroke-width="2"/></pattern><pattern id="dsp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="#d7ccc8"/><line x1="0" y1="0" x2="0" y2="6" stroke="#bcaaa4" stroke-width="1"/></pattern></defs><rect width="820" height="570" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#1d1d1b">Цоколь</text><text x="200" y="80" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1d1b">Разрез</text><text x="600" y="80" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1d1b">Вид спереди</text><rect x="60" y="90" width="30" height="330" rx="0" fill="url(#hatch)" stroke="#1d1d1b" stroke-width="1.5"/><rect x="60" y="420" width="320" height="14" rx="0" fill="url(#hatch)" stroke="#1d1d1b" stroke-width="1.5"/><rect x="90" y="210" width="220" height="150" rx="0" fill="#fafafa" stroke="#1d1d1b" stroke-width="2"/><rect x="310" y="210" width="12" height="150" rx="0" fill="#eceff1" stroke="#1d1d1b" stroke-width="1.5"/><rect x="124" y="360" width="12" height="52" rx="0" fill="#90a4ae" stroke="#1d1d1b" stroke-width="1.2"/><rect x="119" y="412" width="22" height="8" rx="0" fill="#607d8b" stroke="#1d1d1b" stroke-width="1.2"/><rect x="264" y="360" width="12" height="52" rx="0" fill="#90a4ae" stroke="#1d1d1b" stroke-width="1.2"/><rect x="259" y="412" width="22" height="8" rx="0" fill="#607d8b" stroke="#1d1d1b" stroke-width="1.2"/><rect x="282" y="362" width="10" height="58" rx="0" fill="#90a4ae" stroke="#1d1d1b" stroke-width="1.2"/><path d="M270 384h12M270 400h12" stroke="#1d1d1b" stroke-width="2"/><rect x="282" y="414" width="10" height="6" rx="0" fill="#424242" stroke="#1d1d1b" stroke-width="0.5"/><line x1="360" y1="380" x2="296" y2="390" stroke="#1d1d1b" stroke-width="1.6" marker-end="url(#ar)"/><text x="364" y="384" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">цоколь</text><line x1="360" y1="420" x2="294" y2="416" stroke="#1d1d1b" stroke-width="1.6" marker-end="url(#ar)"/><text x="364" y="430" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">уплотнитель</text><line x1="282" y1="450" x2="322" y2="450" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="302" y="442" font-size="12" font-weight="700" text-anchor="middle" fill="#1d1d1b">30–50</text><line x1="60" y1="360" x2="60" y2="420" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="52" y="395" font-size="12" font-weight="700" text-anchor="end" fill="#1d1d1b">100–150</text><rect x="450" y="180" width="120" height="180" rx="0" fill="#fafafa" stroke="#1d1d1b" stroke-width="2"/><rect x="570" y="180" width="120" height="180" rx="0" fill="#fafafa" stroke="#1d1d1b" stroke-width="2"/><rect x="690" y="120" width="100" height="240" rx="0" fill="#fafafa" stroke="#1d1d1b" stroke-width="2"/><rect x="450" y="360" width="340" height="50" rx="0" fill="#90a4ae" stroke="#1d1d1b" stroke-width="2"/><text x="740" y="300" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66">холодильник</text><line x1="705" y1="368" x2="705" y2="402" stroke="#455a64" stroke-width="2"/><line x1="713" y1="368" x2="713" y2="402" stroke="#455a64" stroke-width="2"/><line x1="721" y1="368" x2="721" y2="402" stroke="#455a64" stroke-width="2"/><line x1="729" y1="368" x2="729" y2="402" stroke="#455a64" stroke-width="2"/><line x1="737" y1="368" x2="737" y2="402" stroke="#455a64" stroke-width="2"/><line x1="745" y1="368" x2="745" y2="402" stroke="#455a64" stroke-width="2"/><line x1="753" y1="368" x2="753" y2="402" stroke="#455a64" stroke-width="2"/><line x1="761" y1="368" x2="761" y2="402" stroke="#455a64" stroke-width="2"/><line x1="769" y1="368" x2="769" y2="402" stroke="#455a64" stroke-width="2"/><line x1="777" y1="368" x2="777" y2="402" stroke="#455a64" stroke-width="2"/><line x1="700" y1="460" x2="740" y2="404" stroke="#1d1d1b" stroke-width="1.6" marker-end="url(#ar)"/><text x="560" y="470" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">решётка: холодильник берёт воздух</text><text x="40" y="520" font-size="13" font-weight="400" text-anchor="start" fill="#6f6c66">Цоколь ставят последним, когда ножки выставлены. Клипса — на каждую переднюю ножку.</text><text x="40" y="538" font-size="13" font-weight="400" text-anchor="start" fill="#6f6c66">Под встроенным холодильником и духовкой с вентиляцией снизу — решётка, иначе техника перегревается.</text></svg>