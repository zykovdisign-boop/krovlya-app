<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Духовка и посудомойка</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d1d1b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ece7dd"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc8bb" stroke-width="2"/></pattern><pattern id="dsp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="#d7ccc8"/><line x1="0" y1="0" x2="0" y2="6" stroke="#bcaaa4" stroke-width="1"/></pattern></defs><rect width="880" height="540" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#1d1d1b">Духовка и посудомойка</text><text x="200" y="80" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1d1b">Ниша под духовку, разрез</text><text x="600" y="80" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1d1b">Посудомойка</text><rect x="50" y="100" width="30" height="350" rx="0" fill="url(#hatch)" stroke="#1d1d1b" stroke-width="1.5"/><rect x="50" y="450" width="330" height="14" rx="0" fill="url(#hatch)" stroke="#1d1d1b" stroke-width="1.5"/><rect x="80" y="120" width="220" height="18" rx="0" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="2"/><rect x="80" y="138" width="210" height="252" rx="0" fill="none" stroke="#1d1d1b" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="130" y="170" width="160" height="160" rx="0" fill="#eceff1" stroke="#1d1d1b" stroke-width="2"/><rect x="290" y="170" width="14" height="160" rx="0" fill="#90a4ae" stroke="#1d1d1b" stroke-width="1.5"/><text x="210" y="255" font-size="13" font-weight="400" text-anchor="middle" fill="#1d1d1b">духовка</text><rect x="80" y="330" width="220" height="16" rx="0" fill="#fafafa" stroke="#1d1d1b" stroke-width="1.5"/><rect x="80" y="390" width="220" height="60" rx="0" fill="#90a4ae" stroke="#1d1d1b" stroke-width="1"/><line x1="80" y1="155" x2="130" y2="155" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="105" y="147" font-size="12" font-weight="700" text-anchor="middle" fill="#1d1d1b">40–50</text><path d="M160 330v16M260 330v16" stroke="#d84315" stroke-width="3" stroke-dasharray="4 3"/><text x="330" y="352" font-size="12" font-weight="400" text-anchor="start" fill="#d84315">вырез в полке</text><line x1="150" y1="300" x2="150" y2="190" stroke="#1565c0" stroke-width="1.6" marker-end="url(#ar)"/><line x1="105" y1="360" x2="105" y2="190" stroke="#1565c0" stroke-width="1.6" marker-end="url(#ar)"/><text x="40" y="490" font-size="13" font-weight="400" text-anchor="start" fill="#1565c0">воздух идёт снизу вверх, по задней щели</text><rect x="470" y="140" width="300" height="18" rx="0" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="2"/><rect x="500" y="160" width="220" height="230" rx="0" fill="#eceff1" stroke="#1d1d1b" stroke-width="2"/><text x="610" y="270" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1d1b">ПММ</text><rect x="470" y="140" width="300" height="6" rx="0" fill="#1565c0" stroke="#1565c0" stroke-width="0.5"/><line x1="520" y1="110" x2="560" y2="144" stroke="#1565c0" stroke-width="1.6" marker-end="url(#ar)"/><text x="516" y="106" font-size="12" font-weight="400" text-anchor="end" fill="#1565c0">пароизоляционная лента</text><line x1="500" y1="420" x2="720" y2="420" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="610" y="412" font-size="12" font-weight="700" text-anchor="middle" fill="#1d1d1b">ниша 450 или 600 (+5)</text><line x1="780" y1="158" x2="780" y2="390" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="788" y="279" font-size="12" font-weight="700" text-anchor="start" fill="#1d1d1b">820–870</text><rect x="470" y="390" width="300" height="6" rx="0" fill="#90a4ae" stroke="#1d1d1b" stroke-width="1"/><text x="450" y="470" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Шланги у ПММ короткие: ставьте её рядом с мойкой.</text><text x="450" y="488" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Фасад вешают после выставления машины.</text><text x="40" y="515" font-size="13" font-weight="400" text-anchor="start" fill="#6f6c66">Духовке нужна своя линия от щитка, розетка — в соседнем шкафу.</text></svg>