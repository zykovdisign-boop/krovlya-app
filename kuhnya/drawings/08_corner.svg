<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 530" width="820" height="530" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Угловые модули</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d1d1b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ece7dd"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc8bb" stroke-width="2"/></pattern><pattern id="dsp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="#d7ccc8"/><line x1="0" y1="0" x2="0" y2="6" stroke="#bcaaa4" stroke-width="1"/></pattern></defs><rect width="820" height="530" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#1d1d1b">Угловые модули</text><text x="200" y="80" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1d1b">Г-образный 900 × 900</text><text x="600" y="80" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1d1b">Глухой угловой + добор</text><line x1="400" y1="60" x2="400" y2="470" stroke="#e0dcd3" stroke-width="1.5"/><line x1="40" y1="110" x2="360" y2="110" stroke="#455a64" stroke-width="6"/><line x1="360" y1="110" x2="360" y2="440" stroke="#455a64" stroke-width="6"/><path d="M180 110H360V290H248V222H180z" fill="#fafafa" stroke="#1d1d1b" stroke-width="2"/><path d="M180 222H248V290" fill="none" stroke="#d84315" stroke-width="4"/><path d="M226 222a22 22 0 0 0 22 -22" fill="none" stroke="#d84315" stroke-width="1.5" stroke-dasharray="4 3"/><text x="300" y="160" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66">полки-карусель</text><line x1="120" y1="250" x2="200" y2="226" stroke="#d84315" stroke-width="1.6" marker-end="url(#ar)"/><text x="116" y="260" font-size="13" font-weight="400" text-anchor="end" fill="#d84315">складной фасад</text><line x1="180" y1="320" x2="360" y2="320" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="270" y="312" font-size="12" font-weight="700" text-anchor="middle" fill="#1d1d1b">900</text><line x1="380" y1="110" x2="380" y2="290" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="388" y="205" font-size="12" font-weight="700" text-anchor="start" fill="#1d1d1b">900</text><text x="40" y="380" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Нужны две петли для складного фасада.</text><text x="40" y="398" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Шкафы на второй стене начинаются</text><text x="40" y="416" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">с 900 от угла.</text><line x1="440" y1="110" x2="760" y2="110" stroke="#455a64" stroke-width="6"/><line x1="760" y1="110" x2="760" y2="440" stroke="#455a64" stroke-width="6"/><rect x="560" y="110" width="200" height="112" rx="0" fill="#fafafa" stroke="#1d1d1b" stroke-width="2"/><rect x="560" y="110" width="108" height="112" rx="0" fill="url(#hatch)" stroke="#1d1d1b" stroke-width="1"/><text x="615" y="170" font-size="11" font-weight="400" text-anchor="middle" fill="#6f6c66">глухая часть</text><line x1="668" y1="222" x2="760" y2="222" stroke="#d84315" stroke-width="4"/><text x="714" y="240" font-size="12" font-weight="400" text-anchor="middle" fill="#d84315">дверца</text><rect x="648" y="236" width="112" height="14" rx="0" fill="#d7ccc8" stroke="#1d1d1b" stroke-width="2"/><text x="640" y="248" font-size="12" font-weight="700" text-anchor="end" fill="#1d1d1b">добор 50–100</text><rect x="648" y="250" width="112" height="150" rx="0" fill="#fafafa" stroke="#1d1d1b" stroke-width="2"/><line x1="648" y1="250" x2="648" y2="400" stroke="#d84315" stroke-width="4"/><line x1="560" y1="425" x2="760" y2="425" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="660" y="417" font-size="12" font-weight="700" text-anchor="middle" fill="#1d1d1b">1000</text><text x="440" y="470" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Без добора ручки двух дверей</text><text x="440" y="488" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">встретятся и не дадут открыть ни одну.</text></svg>