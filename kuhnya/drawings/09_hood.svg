<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" width="820" height="600" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Вытяжка</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d1d1b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ece7dd"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc8bb" stroke-width="2"/></pattern><pattern id="dsp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="#d7ccc8"/><line x1="0" y1="0" x2="0" y2="6" stroke="#bcaaa4" stroke-width="1"/></pattern></defs><rect width="820" height="600" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#1d1d1b">Вытяжка</text><rect x="40" y="560" width="740" height="14" rx="0" fill="url(#hatch)" stroke="#1d1d1b" stroke-width="1.5"/><rect x="30" y="70" width="30" height="490" rx="0" fill="url(#hatch)" stroke="#1d1d1b" stroke-width="1.5"/><rect x="60" y="380" width="330" height="180" rx="0" fill="#fafafa" stroke="#1d1d1b" stroke-width="2"/><rect x="60" y="372" width="330" height="8" rx="0" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="2"/><rect x="150" y="366" width="150" height="6" rx="0" fill="#212121" stroke="#1d1d1b" stroke-width="1"/><text x="225" y="358" font-size="13" font-weight="400" text-anchor="middle" fill="#6f6c66">варочная</text><path d="M140 222H310L280 182H170z" fill="#eceff1" stroke="#1d1d1b" stroke-width="2"/><rect x="195" y="70" width="60" height="112" rx="0" fill="#eceff1" stroke="#1d1d1b" stroke-width="2"/><line x1="350" y1="372" x2="350" y2="222" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="358" y="302" font-size="13" font-weight="700" text-anchor="start" fill="#1d1d1b">650 электро · 750 газ</text><path d="M225 100H520V140" fill="none" stroke="#6f6c66" stroke-width="16" stroke-linejoin="round"/><path d="M225 100H520V140" fill="none" stroke="#fff" stroke-width="11" stroke-linejoin="round"/><rect x="500" y="140" width="40" height="40" rx="0" fill="#fff" stroke="#1d1d1b" stroke-width="2"/><line x1="504" y1="146" x2="536" y2="146" stroke="#1d1d1b" stroke-width="1.5"/><line x1="504" y1="153" x2="536" y2="153" stroke="#1d1d1b" stroke-width="1.5"/><line x1="504" y1="160" x2="536" y2="160" stroke="#1d1d1b" stroke-width="1.5"/><line x1="504" y1="167" x2="536" y2="167" stroke="#1d1d1b" stroke-width="1.5"/><line x1="504" y1="174" x2="536" y2="174" stroke="#1d1d1b" stroke-width="1.5"/><text x="560" y="160" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">вентканал с решёткой</text><text x="560" y="178" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">и обратным клапаном</text><text x="272" y="88" font-size="13" font-weight="700" text-anchor="start" fill="#1d1d1b">воздуховод: до 3 м, не больше двух поворотов</text><text x="430" y="330" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Ниже нормы — жарятся фильтры, над газом</text><text x="430" y="348" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">это риск пожара. Выше 850 — тянет слабо.</text><text x="430" y="366" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b"></text><text x="430" y="384" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Не перекрывайте канал целиком: оставьте</text><text x="430" y="402" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">решётку с клапаном для естественной тяги,</text><text x="430" y="420" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">иначе в кухне будет душно при выключенной</text><text x="430" y="438" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">вытяжке.</text></svg>