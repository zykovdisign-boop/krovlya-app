<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="820" height="480" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Конфирмат</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d1d1b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ece7dd"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc8bb" stroke-width="2"/></pattern><pattern id="dsp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="#d7ccc8"/><line x1="0" y1="0" x2="0" y2="6" stroke="#bcaaa4" stroke-width="1"/></pattern></defs><rect width="820" height="480" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#1d1d1b">Конфирмат</text><text x="300" y="76" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1d1b">Разрез: боковина и дно</text><rect x="140" y="90" width="64" height="330" rx="0" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="2"/><text x="172" y="82" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66">боковина</text><rect x="204" y="268" width="400" height="64" rx="0" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="2"/><text x="464" y="354" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66">дно</text><path d="M139 278L150 286V314L139 322z" fill="#fff" stroke="#1d1d1b" stroke-width="1.2"/><rect x="150" y="286" width="54" height="28" rx="0" fill="#fff" stroke="#1d1d1b" stroke-width="1.2"/><rect x="204" y="291" width="136" height="18" rx="0" fill="#fff" stroke="#1d1d1b" stroke-width="1.2"/><path d="M139 280L149 287H208V313H149L139 320z" fill="#b0bec5" stroke="#1d1d1b" stroke-width="1.5"/><path d="M208 287L214 292L220 287L226 292L232 287L238 292L244 287L250 292L256 287L262 292L268 287L274 292L280 287L286 292L292 287L298 292L304 287L310 292L316 287L322 292L328 287L334 292L340 287V313H208z" fill="#b0bec5" stroke="#1d1d1b" stroke-width="1.2"/><line x1="204" y1="240" x2="340" y2="240" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="272" y="232" font-size="12" font-weight="700" text-anchor="middle" fill="#1d1d1b">34 мм в торец</text><line x1="139" y1="210" x2="340" y2="210" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="239.5" y="202" font-size="12" font-weight="700" text-anchor="middle" fill="#1d1d1b">конфирмат 7×50</text><line x1="70" y1="240" x2="142" y2="282" stroke="#1d1d1b" stroke-width="1.6" marker-end="url(#ar)"/><text x="20" y="234" font-size="12" font-weight="400" text-anchor="start" fill="#1d1d1b">раззенковка</text><line x1="180" y1="410" x2="172" y2="316" stroke="#1d1d1b" stroke-width="1.6" marker-end="url(#ar)"/><text x="184" y="426" font-size="12" font-weight="400" text-anchor="middle" fill="#1d1d1b">Ø7 в боковине</text><line x1="290" y1="410" x2="280" y2="312" stroke="#1d1d1b" stroke-width="1.6" marker-end="url(#ar)"/><text x="300" y="426" font-size="12" font-weight="400" text-anchor="middle" fill="#1d1d1b">Ø4,5–5 в торце дна</text><line x1="624" y1="268" x2="624" y2="332" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="632" y="305" font-size="12" font-weight="700" text-anchor="start" fill="#1d1d1b">16</text><text x="624" y="360" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66">по центру толщины</text><text x="560" y="120" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Ступенчатое сверло делает</text><text x="560" y="138" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">все три отверстия за раз.</text><text x="560" y="156" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b"></text><text x="560" y="174" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">От края детали 50 мм,</text><text x="560" y="192" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">дальше через 150–250 мм.</text><text x="560" y="210" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b"></text><text x="560" y="228" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Шляпку на видимых боковинах</text><text x="560" y="246" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">закрывают заглушкой.</text></svg>