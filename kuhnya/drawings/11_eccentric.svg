<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="820" height="480" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Эксцентриковая стяжка</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d1d1b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ece7dd"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc8bb" stroke-width="2"/></pattern><pattern id="dsp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="#d7ccc8"/><line x1="0" y1="0" x2="0" y2="6" stroke="#bcaaa4" stroke-width="1"/></pattern></defs><rect width="820" height="480" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#1d1d1b">Эксцентриковая стяжка</text><text x="300" y="76" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1d1b">Разрез соединения</text><text x="680" y="76" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1d1b">Как повернуть</text><rect x="80" y="100" width="64" height="320" rx="0" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="2"/><text x="112" y="440" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66">деталь со штоком</text><rect x="144" y="240" width="380" height="64" rx="0" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="2"/><text x="400" y="330" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66">деталь с эксцентриком</text><rect x="110" y="264" width="34" height="16" rx="0" fill="#b0bec5" stroke="#1d1d1b" stroke-width="1.2"/><rect x="144" y="266" width="116" height="12" rx="0" fill="#b0bec5" stroke="#1d1d1b" stroke-width="1.2"/><circle cx="266" cy="272" r="9" fill="#b0bec5" stroke="#1d1d1b" stroke-width="1.5"/><rect x="240" y="240" width="60" height="52" rx="0" fill="#cfd8dc" stroke="#1d1d1b" stroke-width="1.5"/><path d="M250 292a20 20 0 0 1 40 0" fill="none" stroke="#1d1d1b" stroke-width="1.5"/><line x1="330" y1="200" x2="282" y2="244" stroke="#1d1d1b" stroke-width="1.6" marker-end="url(#ar)"/><text x="334" y="196" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">эксцентрик Ø15</text><line x1="200" y1="190" x2="200" y2="268" stroke="#1d1d1b" stroke-width="1.6" marker-end="url(#ar)"/><text x="200" y="182" font-size="13" font-weight="400" text-anchor="middle" fill="#1d1d1b">шток</text><line x1="140" y1="360" x2="124" y2="276" stroke="#1d1d1b" stroke-width="1.6" marker-end="url(#ar)"/><text x="150" y="376" font-size="12" font-weight="400" text-anchor="start" fill="#1d1d1b">отверстие 5 мм под шток</text><line x1="144" y1="330" x2="270" y2="330" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="207" y="350" font-size="12" font-weight="700" text-anchor="middle" fill="#1d1d1b">канал Ø8 из торца</text><circle cx="680" cy="210" r="60" fill="#cfd8dc" stroke="#1d1d1b" stroke-width="2"/><rect x="674" y="160" width="12" height="100" fill="#fff" stroke="#1d1d1b" stroke-width="1.5"/><path d="M680 150a60 60 0 0 1 0 0" fill="none"/><path d="M628 180a60 60 0 0 1 52 -30" fill="none" stroke="#d84315" stroke-width="3" marker-end="url(#ar)"/><path d="M620 210h-50" stroke="#1d1d1b" stroke-width="10"/><circle cx="626" cy="210" r="8" fill="#b0bec5" stroke="#1d1d1b" stroke-width="1.5"/><text x="560" y="240" font-size="12" font-weight="400" text-anchor="middle" fill="#1d1d1b">шток</text><text x="680" y="300" font-size="13" font-weight="700" text-anchor="middle" fill="#d84315">по часовой, пол-оборота</text><text x="560" y="340" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Открытая часть эксцентрика</text><text x="560" y="358" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">смотрит к штоку, иначе</text><text x="560" y="376" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">грибок в него не зайдёт.</text><text x="560" y="394" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b"></text><text x="560" y="412" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Дальше пол-оборота не крутите:</text><text x="560" y="430" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">пластик лопается.</text></svg>