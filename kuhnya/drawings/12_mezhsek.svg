<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="820" height="480" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Межсекционная стяжка</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d1d1b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ece7dd"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc8bb" stroke-width="2"/></pattern><pattern id="dsp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="#d7ccc8"/><line x1="0" y1="0" x2="0" y2="6" stroke="#bcaaa4" stroke-width="1"/></pattern></defs><rect width="820" height="480" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#1d1d1b">Межсекционная стяжка</text><text x="250" y="76" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1d1b">Вид сверху на стык двух шкафов</text><rect x="80" y="100" width="300" height="32" rx="0" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="2"/><rect x="80" y="132" width="300" height="32" rx="0" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="2"/><text x="230" y="122" font-size="12" font-weight="400" text-anchor="middle" fill="#1d1d1b">боковина шкафа 1</text><text x="230" y="154" font-size="12" font-weight="400" text-anchor="middle" fill="#1d1d1b">боковина шкафа 2</text><line x1="380" y1="90" x2="380" y2="180" stroke="#1d1d1b" stroke-width="2.5"/><text x="392" y="140" font-size="12" font-weight="400" text-anchor="start" fill="#6f6c66">лицевая сторона</text><rect x="320" y="92" width="18" height="8" rx="0" fill="#b0bec5" stroke="#1d1d1b" stroke-width="1.2"/><rect x="325" y="100" width="8" height="64" rx="0" fill="#b0bec5" stroke="#1d1d1b" stroke-width="1.2"/><rect x="320" y="164" width="18" height="8" rx="0" fill="#b0bec5" stroke="#1d1d1b" stroke-width="1.2"/><line x1="329" y1="200" x2="380" y2="200" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="354.5" y="192" font-size="12" font-weight="700" text-anchor="middle" fill="#1d1d1b">30–40 мм</text><line x1="260" y1="230" x2="324" y2="168" stroke="#1d1d1b" stroke-width="1.6" marker-end="url(#ar)"/><text x="256" y="240" font-size="13" font-weight="400" text-anchor="end" fill="#1d1d1b">гайка-втулка</text><line x1="440" y1="100" x2="340" y2="96" stroke="#1d1d1b" stroke-width="1.6" marker-end="url(#ar)"/><text x="446" y="104" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">винт</text><text x="620" y="76" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1d1b">Стяжка</text><rect x="540" y="110" width="14" height="50" rx="0" fill="#b0bec5" stroke="#1d1d1b" stroke-width="2"/><rect x="554" y="126" width="90" height="18" rx="0" fill="#b0bec5" stroke="#1d1d1b" stroke-width="2"/><text x="600" y="186" font-size="12" font-weight="400" text-anchor="middle" fill="#1d1d1b">гайка-втулка</text><rect x="540" y="220" width="14" height="50" rx="0" fill="#b0bec5" stroke="#1d1d1b" stroke-width="2"/><rect x="554" y="238" width="110" height="14" rx="0" fill="#b0bec5" stroke="#1d1d1b" stroke-width="2"/><text x="610" y="296" font-size="12" font-weight="400" text-anchor="middle" fill="#1d1d1b">винт</text><text x="40" y="330" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">1. Выставьте оба шкафа по высоте и по фронту, зажмите струбциной.</text><text x="40" y="348" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">2. Сверлите 5 мм насквозь через обе боковины, ближе к петлям.</text><text x="40" y="366" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">3. Под шляпки углубление сверлом 10 мм на 1–2 мм.</text><text x="40" y="384" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">4. Втулка с одной стороны, винт с другой, затянуть отвёрткой.</text><text x="40" y="402" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b"></text><text x="40" y="420" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Нижним шкафам хватает двух стяжек на стык, пеналам ставят 3–4.</text></svg>