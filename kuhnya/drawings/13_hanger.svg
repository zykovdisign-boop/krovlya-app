<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" width="840" height="560" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Навес, шина и крюки</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d1d1b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ece7dd"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc8bb" stroke-width="2"/></pattern><pattern id="dsp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="#d7ccc8"/><line x1="0" y1="0" x2="0" y2="6" stroke="#bcaaa4" stroke-width="1"/></pattern></defs><rect width="840" height="560" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#1d1d1b">Навес, шина и крюки</text><rect x="90" y="60" width="30" height="410" rx="0" fill="url(#hatch)" stroke="#1d1d1b" stroke-width="1.5"/><line x1="90" y1="60" x2="520" y2="60" stroke="#6f6c66" stroke-width="1.5" stroke-dasharray="6 4"/><text x="520" y="54" font-size="12" font-weight="400" text-anchor="end" fill="#6f6c66">потолок</text><rect x="150" y="120" width="200" height="300" rx="0" fill="#fafafa" stroke="#1d1d1b" stroke-width="2"/><rect x="350" y="120" width="12" height="300" rx="0" fill="#eceff1" stroke="#1d1d1b" stroke-width="1.5"/><path d="M120 150h18v-16h6v26h-24z" fill="#b0bec5" stroke="#1d1d1b" stroke-width="1.5"/><rect x="152" y="122" width="40" height="52" rx="0" fill="#90a4ae" stroke="#1d1d1b" stroke-width="1.2"/><path d="M152 130h-14v8h8" fill="none" stroke="#1d1d1b" stroke-width="3"/><line x1="176" y1="200" x2="176" y2="182" stroke="#1565c0" stroke-width="1.6" marker-end="url(#ar)"/><line x1="176" y1="182" x2="176" y2="200" stroke="#1565c0" stroke-width="1.6" marker-end="url(#ar)"/><text x="184" y="214" font-size="12" font-weight="400" text-anchor="start" fill="#1565c0">винт высоты</text><line x1="200" y1="150" x2="220" y2="150" stroke="#1565c0" stroke-width="1.6" marker-end="url(#ar)"/><line x1="220" y1="150" x2="200" y2="150" stroke="#1565c0" stroke-width="1.6" marker-end="url(#ar)"/><text x="226" y="154" font-size="12" font-weight="400" text-anchor="start" fill="#1565c0">винт прижима</text><line x1="120" y1="120" x2="420" y2="120" stroke="#d84315" stroke-width="1" stroke-dasharray="4 3"/><text x="424" y="124" font-size="12" font-weight="400" text-anchor="start" fill="#d84315">линия верха шкафов</text><line x1="120" y1="136" x2="420" y2="136" stroke="#1565c0" stroke-width="1" stroke-dasharray="4 3"/><text x="424" y="146" font-size="12" font-weight="400" text-anchor="start" fill="#1565c0">линия шины = верх − h</text><line x1="400" y1="120" x2="400" y2="136" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="408" y="133" font-size="11" font-weight="700" text-anchor="start" fill="#1d1d1b"></text><text x="408" y="133" font-size="13" font-weight="700" text-anchor="start" fill="#1d1d1b">h</text><line x1="470" y1="60" x2="470" y2="120" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="478" y="95" font-size="12" font-weight="700" text-anchor="start" fill="#1d1d1b">≥ 30 мм</text><text x="40" y="500" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">h — от верха шкафа до нижней точки зацепа навеса. Обычно 25–40 мм, меряйте на своём шкафу.</text><text x="40" y="518" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Навес выставьте в среднее положение до замера, чтобы остался ход вверх и вниз.</text><text x="660" y="90" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1d1b">Без шины: крюк в дюбель</text><rect x="590" y="120" width="30" height="240" rx="0" fill="url(#hatch)" stroke="#1d1d1b" stroke-width="1.5"/><rect x="620" y="226" width="40" height="12" rx="0" fill="#fff" stroke="#1d1d1b" stroke-width="1.2"/><rect x="620" y="229" width="36" height="6" rx="0" fill="#b0bec5" stroke="#1d1d1b" stroke-width="1"/><path d="M656 232h14v-16" fill="none" stroke="#1d1d1b" stroke-width="4"/><line x1="620" y1="270" x2="670" y2="270" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="645" y="262" font-size="12" font-weight="700" text-anchor="middle" fill="#1d1d1b">8–10 мм</text><text x="700" y="320" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66">дюбель 8 мм</text><text x="600" y="380" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Один крюк на каждый навес.</text><text x="600" y="398" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Расстояние между крюками</text><text x="600" y="416" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">меряют на самом шкафу.</text></svg>