<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Петля</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d1d1b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ece7dd"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc8bb" stroke-width="2"/></pattern><pattern id="dsp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="#d7ccc8"/><line x1="0" y1="0" x2="0" y2="6" stroke="#bcaaa4" stroke-width="1"/></pattern></defs><rect width="820" height="560" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#1d1d1b">Петля</text><text x="220" y="76" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1d1b">Фасад, вид изнутри</text><text x="620" y="76" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1d1b">Разрез и регулировка</text><rect x="60" y="100" width="300" height="380" rx="0" fill="#fafafa" stroke="#1d1d1b" stroke-width="2"/><circle cx="146" cy="190" r="35" fill="#fff" stroke="#1d1d1b" stroke-width="2"/><circle cx="146" cy="190" r="3" fill="#1d1d1b"/><circle cx="146" cy="390" r="35" fill="#fff" stroke="#1d1d1b" stroke-width="2"/><circle cx="146" cy="390" r="3" fill="#1d1d1b"/><line x1="60" y1="236" x2="146" y2="236" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="103" y="228" font-size="12" font-weight="700" text-anchor="middle" fill="#1d1d1b">21,5–22,5</text><line x1="260" y1="100" x2="260" y2="190" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="268" y="150" font-size="12" font-weight="700" text-anchor="start" fill="#1d1d1b">80–100</text><line x1="260" y1="390" x2="260" y2="480" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="268" y="440" font-size="12" font-weight="700" text-anchor="start" fill="#1d1d1b">80–100</text><text x="146" y="150" font-size="13" font-weight="700" text-anchor="middle" fill="#1d1d1b">Ø35</text><text x="60" y="510" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Глубина чашки 12–13 мм. Пробуйте на обрезке.</text><text x="60" y="528" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Фасад выше 900 мм: третья петля посередине.</text><rect x="470" y="200" width="220" height="26" rx="0" fill="#fafafa" stroke="#1d1d1b" stroke-width="2"/><text x="560" y="246" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66">фасад</text><rect x="500" y="184" width="60" height="16" rx="0" fill="#b0bec5" stroke="#1d1d1b" stroke-width="1.2"/><rect x="560" y="180" width="120" height="14" rx="0" fill="#b0bec5" stroke="#1d1d1b" stroke-width="1.2"/><rect x="690" y="120" width="26" height="200" rx="0" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="2"/><text x="703" y="340" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66">боковина</text><rect x="664" y="160" width="26" height="40" rx="0" fill="#90a4ae" stroke="#1d1d1b" stroke-width="1.2"/><text x="640" y="150" font-size="12" font-weight="400" text-anchor="middle" fill="#1d1d1b">планка</text><line x1="690" y1="380" x2="716" y2="380" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="703" y="372" font-size="11" font-weight="700" text-anchor="middle" fill="#1d1d1b"></text><text x="703" y="404" font-size="12" font-weight="400" text-anchor="middle" fill="#1d1d1b">37 мм от края</text><circle cx="580" cy="157" r="11" fill="#1d1d1b"/><text x="580" y="162" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">1</text><line x1="580" y1="168" x2="580" y2="181" stroke="#1d1d1b" stroke-width="1.2"/><circle cx="620" cy="157" r="11" fill="#1d1d1b"/><text x="620" y="162" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">2</text><line x1="620" y1="168" x2="620" y2="181" stroke="#1d1d1b" stroke-width="1.2"/><circle cx="677" cy="148" r="11" fill="#1d1d1b"/><text x="677" y="153" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">3</text><line x1="677" y1="159" x2="677" y2="172" stroke="#1d1d1b" stroke-width="1.2"/><text x="470" y="440" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">1 — вбок, зазор между фасадами</text><text x="470" y="458" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">2 — к корпусу и от него</text><text x="470" y="476" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">3 — вверх и вниз (на планке)</text></svg>