t="4" rx="0" fill="#d84315" stroke="#d84315" stroke-width="0.5"/><rect x="286" y="302" width="4" height="18" rx="0" fill="#d84315" stroke="#d84315" stroke-width="0.5"/><text x="40" y="450" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">1 выпуск: решётка с толстой прокладкой сверху, тонкая снизу, длинный винт</text><text x="40" y="468" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">2 колба или колено: здесь стоит вода и не пускает запах</text><text x="40" y="486" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">3 боковой отвод под шланг ПММ, без машины закрыть заглушкой</text><text x="40" y="504" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">4 гофра под уклоном к канализации, без провиса</text><text x="40" y="522" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">5 манжета в раструбе канализации 50 мм</text><text x="560" y="160" font-size="13" font-weight="400" text-anchor="start" fill="#d84315">Красным — прокладки.</text><text x="560" y="180" font-size="13" font-weight="700" text-anchor="start" fill="#1d1d1b">Гайки только рукой.</text></svg>