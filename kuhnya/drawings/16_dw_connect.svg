<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Подключение посудомойки</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d1d1b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ece7dd"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc8bb" stroke-width="2"/></pattern><pattern id="dsp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="#d7ccc8"/><line x1="0" y1="0" x2="0" y2="6" stroke="#bcaaa4" stroke-width="1"/></pattern></defs><rect width="820" height="560" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#1d1d1b">Подключение посудомойки</text><rect x="30" y="70" width="30" height="400" rx="0" fill="url(#hatch)" stroke="#1d1d1b" stroke-width="1.5"/><rect x="30" y="470" width="760" height="14" rx="0" fill="url(#hatch)" stroke="#1d1d1b" stroke-width="1.5"/><rect x="90" y="150" width="260" height="26" rx="0" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="2"/><rect x="350" y="150" width="260" height="26" rx="0" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="2"/><rect x="370" y="186" width="220" height="270" rx="0" fill="#eceff1" stroke="#1d1d1b" stroke-width="1.8"/><text x="480" y="330" font-size="16" font-weight="700" text-anchor="middle" fill="#1d1d1b">ПММ</text><rect x="350" y="176" width="260" height="6" rx="0" fill="#1565c0" stroke="#1565c0" stroke-width="0.5"/><text x="620" y="190" font-size="12" font-weight="400" text-anchor="start" fill="#1565c0">пароизоляция</text><polyline points="60,360 120,360" fill="none" stroke="#1565c0" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M118 350L142 370L142 350L118 370z" fill="#fff" stroke="#1d1d1b" stroke-width="2"/><circle cx="130" cy="360" r="3.5" fill="#1d1d1b"/><line x1="130" y1="360" x2="130" y2="340" stroke="#1d1d1b" stroke-width="2.5"/><line x1="122" y1="340" x2="138" y2="340" stroke="#1d1d1b" stroke-width="3" stroke-linecap="round"/><polyline points="142,360 180,360 180,300" fill="none" stroke="#1565c0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="130" y="396" font-size="12" font-weight="400" text-anchor="middle" fill="#1d1d1b">кран-тройник</text><text x="130" y="412" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66">на холодной</text><path d="M130 372V420H250V440H380" fill="none" stroke="#1565c0" stroke-width="5" stroke-linejoin="round"/><text x="260" y="456" font-size="12" font-weight="400" text-anchor="middle" fill="#1565c0">заливной шланг</text><rect x="220" y="250" width="40" height="70" rx="10" fill="#eceff1" stroke="#1d1d1b" stroke-width="1.5"/><rect x="260" y="290" width="30" height="12" rx="0" fill="#eceff1" stroke="#1d1d1b" stroke-width="1.2"/><path d="M380 400H330V200Q330 186 316 186H300Q290 186 290 200V296" fill="none" stroke="#6d4c41" stroke-width="5" stroke-linejoin="round"/><text x="300" y="230" font-size="13" font-weight="700" text-anchor="end" fill="#6d4c41">петля</text><text x="300" y="246" font-size="12" font-weight="400" text-anchor="end" fill="#6d4c41">сливного шланга</text><line x1="700" y1="470" x2="700" y2="190" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="708" y="335" font-size="12" font-weight="700" text-anchor="start" fill="#1d1d1b"></text><text x="708" y="320" font-size="12" font-weight="400" text-anchor="start" fill="#1d1d1b">верх петли</text><text x="708" y="336" font-size="13" font-weight="700" text-anchor="start" fill="#1d1d1b">40–100 см</text><text x="708" y="352" font-size="12" font-weight="400" text-anchor="start" fill="#1d1d1b">от пола</text><line x1="316" y1="186" x2="700" y2="190" stroke="#6f6c66" stroke-width="0.8" stroke-dasharray="4 3"/><text x="240" y="340" font-size="12" font-weight="400" text-anchor="middle" fill="#1d1d1b">сифон</text><text x="240" y="140" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66">шкаф под мойку</text><text x="40" y="510" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Шланги и вилка идут в шкаф под мойку через отверстие 50–60 мм в боковине. Розетка тоже там, не за машиной.</text><text x="40" y="528" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Без петли грязная вода из мойки стекает в машину. Точная высота петли написана в инструкции машины.</text></svg>