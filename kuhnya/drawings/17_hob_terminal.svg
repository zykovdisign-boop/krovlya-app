<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" width="820" height="450" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Подключение варочной панели</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d1d1b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ece7dd"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc8bb" stroke-width="2"/></pattern><pattern id="dsp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="#d7ccc8"/><line x1="0" y1="0" x2="0" y2="6" stroke="#bcaaa4" stroke-width="1"/></pattern></defs><rect width="820" height="450" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#1d1d1b">Подключение варочной панели</text><text x="250" y="76" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1d1b">Одна фаза 220 В: кабель 3 жилы</text><rect x="60" y="110" width="400" height="110" rx="8" fill="#fafafa" stroke="#1d1d1b" stroke-width="2"/><rect x="82" y="130" width="36" height="50" rx="0" fill="#fff" stroke="#1d1d1b" stroke-width="1.5"/><circle cx="100" cy="150" r="7" fill="#b0bec5" stroke="#1d1d1b" stroke-width="1"/><text x="100" y="126" font-size="13" font-weight="700" text-anchor="middle" fill="#1d1d1b">1</text><rect x="142" y="130" width="36" height="50" rx="0" fill="#fff" stroke="#1d1d1b" stroke-width="1.5"/><circle cx="160" cy="150" r="7" fill="#b0bec5" stroke="#1d1d1b" stroke-width="1"/><text x="160" y="126" font-size="13" font-weight="700" text-anchor="middle" fill="#1d1d1b">2</text><rect x="202" y="130" width="36" height="50" rx="0" fill="#fff" stroke="#1d1d1b" stroke-width="1.5"/><circle cx="220" cy="150" r="7" fill="#b0bec5" stroke="#1d1d1b" stroke-width="1"/><text x="220" y="126" font-size="13" font-weight="700" text-anchor="middle" fill="#1d1d1b">3</text><rect x="282" y="130" width="36" height="50" rx="0" fill="#fff" stroke="#1d1d1b" stroke-width="1.5"/><circle cx="300" cy="150" r="7" fill="#b0bec5" stroke="#1d1d1b" stroke-width="1"/><text x="300" y="126" font-size="13" font-weight="700" text-anchor="middle" fill="#1d1d1b">4</text><rect x="342" y="130" width="36" height="50" rx="0" fill="#fff" stroke="#1d1d1b" stroke-width="1.5"/><circle cx="360" cy="150" r="7" fill="#b0bec5" stroke="#1d1d1b" stroke-width="1"/><text x="360" y="126" font-size="13" font-weight="700" text-anchor="middle" fill="#1d1d1b">5</text><rect x="412" y="130" width="36" height="50" rx="0" fill="#fff" stroke="#1d1d1b" stroke-width="1.5"/><circle cx="430" cy="150" r="7" fill="#b0bec5" stroke="#1d1d1b" stroke-width="1"/><text x="430" y="126" font-size="13" font-weight="700" text-anchor="middle" fill="#1d1d1b">⏚</text><path d="M100 150H220" stroke="#ffb300" stroke-width="6"/><path d="M300 150H360" stroke="#ffb300" stroke-width="6"/><text x="160" y="100" font-size="12" font-weight="700" text-anchor="middle" fill="#e65100">перемычки</text><text x="330" y="100" font-size="12" font-weight="700" text-anchor="middle" fill="#e65100">перемычка</text><polyline points="100,160 100,300" fill="none" stroke="#795548" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><polyline points="300,160 300,300" fill="none" stroke="#1565c0" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><polyline points="430,160 430,300" fill="none" stroke="#9e9d24" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><text x="100" y="320" font-size="13" font-weight="700" text-anchor="middle" fill="#795548">фаза L</text><text x="100" y="336" font-size="11" font-weight="400" text-anchor="middle" fill="#6f6c66">коричневая, чёрная, серая</text><text x="300" y="320" font-size="13" font-weight="700" text-anchor="middle" fill="#1565c0">ноль N</text><text x="300" y="336" font-size="11" font-weight="400" text-anchor="middle" fill="#6f6c66">синяя</text><text x="430" y="320" font-size="13" font-weight="700" text-anchor="middle" fill="#9e9d24">земля PE</text><text x="430" y="336" font-size="11" font-weight="400" text-anchor="middle" fill="#6f6c66">жёлто-зелёная</text><text x="520" y="120" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Это частая схема, но не единственная.</text><text x="520" y="138" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Сверяйтесь с наклейкой на своей панели.</text><text x="520" y="156" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b"></text><text x="520" y="174" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Перед работой выключите автомат</text><text x="520" y="192" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">и проверьте индикатором, что</text><text x="520" y="210" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">напряжения нет.</text><text x="520" y="228" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b"></text><text x="520" y="246" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Кабель обычно медный 3×6 мм²,</text><text x="520" y="264" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">автомат 32 А. Точно — по паспорту.</text><text x="520" y="282" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b"></text><text x="520" y="300" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Линии нет — нужен электрик.</text><text x="60" y="390" font-size="13" font-weight="400" text-anchor="start" fill="#6f6c66">Без перемычек при одной фазе греется только часть конфорок.</text><text x="60" y="408" font-size="13" font-weight="400" text-anchor="start" fill="#6f6c66">Пять жил бывает в домах с трёхфазным вводом: там перемычки ставят по другой схеме с наклейки.</text></svg>