<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Чем собирается кухня: смотрим на отверстия</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d1d1b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ece7dd"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc8bb" stroke-width="2"/></pattern><pattern id="dsp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="#d7ccc8"/><line x1="0" y1="0" x2="0" y2="6" stroke="#bcaaa4" stroke-width="1"/></pattern></defs><rect width="820" height="420" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#1d1d1b">Чем собирается кухня: смотрим на отверстия</text><rect x="40" y="110" width="220" height="150" rx="0" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="2"/><text x="150" y="98" font-size="14" font-weight="700" text-anchor="middle" fill="#1d1d1b">Эксцентрик</text><circle cx="110" cy="185" r="22" fill="#fff" stroke="#1d1d1b" stroke-width="2"/><rect x="40" y="180" width="50" height="10" rx="0" fill="#fff" stroke="#1d1d1b" stroke-width="1.2" stroke-dasharray="4 3"/><circle cx="200" cy="140" r="5" fill="#fff" stroke="#1d1d1b" stroke-width="1.5"/><circle cx="200" cy="230" r="5" fill="#fff" stroke="#1d1d1b" stroke-width="1.5"/><text x="150" y="300" font-size="12" font-weight="400" text-anchor="middle" fill="#1d1d1b">круглая выемка Ø15 у края,</text><text x="150" y="316" font-size="12" font-weight="400" text-anchor="middle" fill="#1d1d1b">из торца к ней канал Ø8</text><rect x="300" y="110" width="220" height="150" rx="0" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="2"/><text x="410" y="98" font-size="14" font-weight="700" text-anchor="middle" fill="#1d1d1b">Конфирмат</text><circle cx="318" cy="140" r="7" fill="#fff" stroke="#1d1d1b" stroke-width="2"/><circle cx="318" cy="140" r="11" fill="none" stroke="#6f6c66" stroke-width="1" stroke-dasharray="2 2"/><circle cx="318" cy="185" r="7" fill="#fff" stroke="#1d1d1b" stroke-width="2"/><circle cx="318" cy="185" r="11" fill="none" stroke="#6f6c66" stroke-width="1" stroke-dasharray="2 2"/><circle cx="318" cy="230" r="7" fill="#fff" stroke="#1d1d1b" stroke-width="2"/><circle cx="318" cy="230" r="11" fill="none" stroke="#6f6c66" stroke-width="1" stroke-dasharray="2 2"/><text x="410" y="300" font-size="12" font-weight="400" text-anchor="middle" fill="#1d1d1b">сквозные отверстия Ø7</text><text x="410" y="316" font-size="12" font-weight="400" text-anchor="middle" fill="#1d1d1b">в 8 мм от края, видны снаружи</text><rect x="560" y="110" width="220" height="150" rx="0" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="2"/><text x="670" y="98" font-size="14" font-weight="700" text-anchor="middle" fill="#1d1d1b">Внутренняя сторона</text><circle cx="600" cy="135" r="3" fill="#fff" stroke="#1d1d1b" stroke-width="1.2"/><circle cx="740" cy="135" r="3" fill="#fff" stroke="#1d1d1b" stroke-width="1.2"/><circle cx="600" cy="151" r="3" fill="#fff" stroke="#1d1d1b" stroke-width="1.2"/><circle cx="740" cy="151" r="3" fill="#fff" stroke="#1d1d1b" stroke-width="1.2"/><circle cx="600" cy="167" r="3" fill="#fff" stroke="#1d1d1b" stroke-width="1.2"/><circle cx="740" cy="167" r="3" fill="#fff" stroke="#1d1d1b" stroke-width="1.2"/><circle cx="600" cy="183" r="3" fill="#fff" stroke="#1d1d1b" stroke-width="1.2"/><circle cx="740" cy="183" r="3" fill="#fff" stroke="#1d1d1b" stroke-width="1.2"/><circle cx="600" cy="199" r="3" fill="#fff" stroke="#1d1d1b" stroke-width="1.2"/><circle cx="740" cy="199" r="3" fill="#fff" stroke="#1d1d1b" stroke-width="1.2"/><circle cx="600" cy="215" r="3" fill="#fff" stroke="#1d1d1b" stroke-width="1.2"/><circle cx="740" cy="215" r="3" fill="#fff" stroke="#1d1d1b" stroke-width="1.2"/><circle cx="600" cy="231" r="3" fill="#fff" stroke="#1d1d1b" stroke-width="1.2"/><circle cx="740" cy="231" r="3" fill="#fff" stroke="#1d1d1b" stroke-width="1.2"/><circle cx="600" cy="247" r="3" fill="#fff" stroke="#1d1d1b" stroke-width="1.2"/><circle cx="740" cy="247" r="3" fill="#fff" stroke="#1d1d1b" stroke-width="1.2"/><text x="670" y="300" font-size="12" font-weight="400" text-anchor="middle" fill="#1d1d1b">ряды мелких отверстий Ø5:</text><text x="670" y="316" font-size="12" font-weight="400" text-anchor="middle" fill="#1d1d1b">полки и петли, это сторона внутрь</text><text x="40" y="370" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Нет ни выемок, ни сквозных отверстий: сверлить под конфирматы придётся самим.</text><text x="40" y="388" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Деревянные шканты Ø8 бывают при любом способе: они только совмещают детали.</text></svg>