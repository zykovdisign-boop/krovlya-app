<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 590" width="820" height="590" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Нижний шкаф: из чего собран</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d1d1b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ece7dd"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc8bb" stroke-width="2"/></pattern><pattern id="dsp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="#d7ccc8"/><line x1="0" y1="0" x2="0" y2="6" stroke="#bcaaa4" stroke-width="1"/></pattern></defs><rect width="820" height="590" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#1d1d1b">Нижний шкаф: из чего собран</text><path d="M120 140h22l60 -60h-22z" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="1.5"/><path d="M142 140v260l60 -60v-260z" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="1.5"/><rect x="120" y="140" width="22" height="260" rx="0" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="1.5"/><text x="100" y="270" font-size="12" font-weight="700" text-anchor="end" fill="#1d1d1b">боковина</text><path d="M520 140h22l60 -60h-22z" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="1.5"/><path d="M542 140v260l60 -60v-260z" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="1.5"/><rect x="520" y="140" width="22" height="260" rx="0" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="1.5"/><text x="610" y="270" font-size="12" font-weight="700" text-anchor="start" fill="#1d1d1b">боковина</text><path d="M200 380h280l60 -60h-280z" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="1.5"/><path d="M480 380v16l60 -60v-16z" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="1.5"/><rect x="200" y="380" width="280" height="16" rx="0" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="1.5"/><text x="340" y="393" font-size="12" font-weight="700" text-anchor="middle" fill="#1d1d1b">дно</text><path d="M200 110h280l22 -22h-280z" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="1.5"/><path d="M480 110v14l22 -22v-14z" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="1.5"/><rect x="200" y="110" width="280" height="14" rx="0" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="1.5"/><text x="340" y="122" font-size="12" font-weight="700" text-anchor="middle" fill="#1d1d1b">передняя царга</text><path d="M250 70h280l22 -22h-280z" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="1.5"/><path d="M530 70v14l22 -22v-14z" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="1.5"/><rect x="250" y="70" width="280" height="14" rx="0" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="1.5"/><text x="390" y="82" font-size="12" font-weight="700" text-anchor="middle" fill="#1d1d1b">задняя царга</text><rect x="680" y="110" width="100" height="260" rx="0" fill="#f3efe7" stroke="#1d1d1b" stroke-width="2"/><text x="730" y="245" font-size="12" font-weight="700" text-anchor="middle" fill="#1d1d1b">задняя</text><text x="730" y="261" font-size="12" font-weight="700" text-anchor="middle" fill="#1d1d1b">стенка ХДФ</text><rect x="224" y="440" width="12" height="42" rx="0" fill="#90a4ae" stroke="#1d1d1b" stroke-width="1.2"/><rect x="219" y="482" width="22" height="8" rx="0" fill="#607d8b" stroke="#1d1d1b" stroke-width="1.2"/><line x1="230" y1="436" x2="230" y2="410" stroke="#6f6c66" stroke-width="1.6" marker-end="url(#ar)"/><rect x="444" y="440" width="12" height="42" rx="0" fill="#90a4ae" stroke="#1d1d1b" stroke-width="1.2"/><rect x="439" y="482" width="22" height="8" rx="0" fill="#607d8b" stroke="#1d1d1b" stroke-width="1.2"/><line x1="450" y1="436" x2="450" y2="410" stroke="#6f6c66" stroke-width="1.6" marker-end="url(#ar)"/><line x1="200" y1="505" x2="230" y2="505" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="215" y="497" font-size="12" font-weight="700" text-anchor="middle" fill="#1d1d1b">40–60</text><text x="340" y="510" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66">передние ножки от края</text><line x1="160" y1="420" x2="205" y2="395" stroke="#6f6c66" stroke-width="1.6" marker-end="url(#ar)"/><line x1="500" y1="420" x2="520" y2="395" stroke="#6f6c66" stroke-width="1.6" marker-end="url(#ar)"/><text x="40" y="545" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Порядок: шканты → боковина + дно → царги → вторая боковина → диагонали → задняя стенка.</text><text x="40" y="563" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Ножки удобнее прикрутить, пока корпус лежит на боку.</text></svg>