<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 580" width="820" height="580" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Диагонали и задняя стенка</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d1d1b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ece7dd"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc8bb" stroke-width="2"/></pattern><pattern id="dsp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="#d7ccc8"/><line x1="0" y1="0" x2="0" y2="6" stroke="#bcaaa4" stroke-width="1"/></pattern></defs><rect width="820" height="580" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#1d1d1b">Диагонали и задняя стенка</text><rect x="80" y="90" width="300" height="360" rx="0" fill="#fafafa" stroke="#1d1d1b" stroke-width="3"/><line x1="80" y1="90" x2="380" y2="450" stroke="#1565c0" stroke-width="2" stroke-dasharray="8 5"/><line x1="380" y1="90" x2="80" y2="450" stroke="#d84315" stroke-width="2" stroke-dasharray="8 5"/><text x="230" y="250" font-size="20" font-weight="700" text-anchor="middle" fill="#1d1d1b">D1 = D2</text><text x="230" y="276" font-size="13" font-weight="400" text-anchor="middle" fill="#1d1d1b">разница не больше 1–2 мм</text><text x="230" y="480" font-size="13" font-weight="400" text-anchor="middle" fill="#6f6c66">Короб лицом вниз, рулетка из угла в угол</text><rect x="470" y="90" width="300" height="360" rx="0" fill="#f3efe7" stroke="#1d1d1b" stroke-width="2"/><circle cx="485" cy="100" r="3" fill="#1d1d1b"/><circle cx="485" cy="440" r="3" fill="#1d1d1b"/><circle cx="515" cy="100" r="3" fill="#1d1d1b"/><circle cx="515" cy="440" r="3" fill="#1d1d1b"/><circle cx="545" cy="100" r="3" fill="#1d1d1b"/><circle cx="545" cy="440" r="3" fill