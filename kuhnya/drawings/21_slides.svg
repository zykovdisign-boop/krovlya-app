<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" width="820" height="540" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Направляющие: разметка</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d1d1b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ece7dd"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc8bb" stroke-width="2"/></pattern><pattern id="dsp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="#d7ccc8"/><line x1="0" y1="0" x2="0" y2="6" stroke="#bcaaa4" stroke-width="1"/></pattern></defs><rect width="820" height="540" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#1d1d1b">Направляющие: разметка</text><rect x="80" y="90" width="340" height="380" rx="0" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="2"/><text x="250" y="80" font-size="13" font-weight="400" text-anchor="middle" fill="#6f6c66">боковина изнутри</text><rect x="80" y="330" width="60" height="140" rx="0" fill="#ffe082" stroke="#1d1d1b" stroke-width="1.5"/><text x="110" y="405" font-size="12" font-weight="700" text-anchor="middle" fill="#1d1d1b" transform="rotate(-90 110 405)">шаблон</text><line x1="80" y1="330" x2="420" y2="330" stroke="#d84315" stroke-width="1.5" stroke-dasharray="6 4"/><text x="430" y="334" font-size="12" font-weight="400" text-anchor="start" fill="#d84315">линия</text><rect x="84" y="312" width="320" height="18" rx="0" fill="#b0bec5" stroke="#1d1d1b" stroke-width="1.5"/><rect x="103" y="317" width="14" height="8" rx="4" fill="#fff" stroke="#1d1d1b"/><rect x="193" y="317" width="14" height="8" rx="4" fill="#fff" stroke="#1d1d1b"/><rect x="283" y="317" width="14" height="8" rx="4" fill="#fff" stroke="#1d1d1b"/><rect x="373" y="317" width="14" height="8" rx="4" fill="#fff" stroke="#1d1d1b"/><line x1="80" y1="490" x2="84" y2="490" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="82" y="482" font-size="11" font-weight="700" text-anchor="middle" fill="#1d1d1b"></text><text x="130" y="506" font-size="12" font-weight="400" text-anchor="middle" fill="#1d1d1b">0–3 мм от переднего края</text><line x1="300" y1="270" x2="290" y2="314" stroke="#1d1d1b" stroke-width="1.6" marker-end="url(#ar)"/><text x="300" y="262" font-size="12" font-weight="400" text-anchor="middle" fill="#1d1d1b">сначала в овальные отверстия</text><text x="470" y="120" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Один и тот же шаблон прикладывают</text><text x="470" y="138" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">к левой и правой боковине:</text><text x="470" y="156" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">высота получается одинаковая.</text><text x="470" y="174" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b"></text><text x="470" y="192" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Правая и левая направляющие</text><text x="470" y="210" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">разные, на них буквы R и L.</text><text x="470" y="228" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b"></text><text x="470" y="246" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Ящик пошёл ровно — докрутите</text><text x="470" y="264" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">саморезы в круглые отверстия.</text></svg>