<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Нижний ряд: выставление</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d1d1b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ece7dd"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc8bb" stroke-width="2"/></pattern><pattern id="dsp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="#d7ccc8"/><line x1="0" y1="0" x2="0" y2="6" stroke="#bcaaa4" stroke-width="1"/></pattern></defs><rect width="820" height="560" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#1d1d1b">Нижний ряд: выставление</text><rect x="40" y="440" width="750" height="14" rx="0" fill="url(#hatch)" stroke="#1d1d1b" stroke-width="1.5"/><path d="M40 440Q300 452 520 436T790 444" fill="none" stroke="#1d1d1b" stroke-width="2"/><rect x="80" y="200" width="220" height="210" rx="0" fill="#fafafa" stroke="#1d1d1b" stroke-width="2"/><rect x="114" y="410" width="12" height="22" rx="0" fill="#90a4ae" stroke="#1d1d1b" stroke-width="1.2"/><rect x="109" y="432" width="22" height="8" rx="0" fill="#607d8b" stroke="#1d1d1b" stroke-width="1.2"/><rect x="254" y="410" width="12" height="22" rx="0" fill="#90a4ae" stroke="#1d1d1b" stroke-width="1.2"/><rect x="249" y="432" width="22" height="8" rx="0" fill="#607d8b" stroke="#1d1d1b" stroke-width="1.2"/><rect x="300" y="200" width="220" height="210" rx="0" fill="#fafafa" stroke="#1d1d1b" stroke-width="2"/><rect x="334" y="410" width="12" height="16" rx="0" fill="#90a4ae" stroke="#1d1d1b" stroke-width="1.2"/><rect x="329" y="426" width="22" height="8" rx="0" fill="#607d8b" stroke="#1d1d1b" stroke-width="1.2"/><rect x="474" y="410" width="12" height="16" rx="0" fill="#90a4ae" stroke="#1d1d1b" stroke-width="1.2"/><rect x="469" y="426" width="22" height="8" rx="0" fill="#607d8b" stroke="#1d1d1b" stroke-width="1.2"/><rect x="520" y="200" width="220" height="210" rx="0" fill="#fafafa" stroke="#1d1d1b" stroke-width="2"/><rect x="554" y="410" width="12" height="26" rx="0" fill="#90a4ae" stroke="#1d1d1b" stroke-width="1.2"/><rect x="549" y="436" width="22" height="8" rx="0" fill="#607d8b" stroke="#1d1d1b" stroke-width="1.2"/><rect x="694" y="410" width="12" height="26" rx="0" fill="#90a4ae" stroke="#1d1d1b" stroke-width="1.2"/><rect x="689" y="436" width="22" height="8" rx="0" fill="#607d8b" stroke="#1d1d1b" stroke-width="1.2"/><line x1="40" y1="200" x2="790" y2="200" stroke="#d84315" stroke-width="2" stroke-dasharray="10 5"/><text x="790" y="190" font-size="12" font-weight="400" text-anchor="end" fill="#d84315">линия лазера</text><circle cx="300" cy="236" r="6" fill="#b0bec5" stroke="#1d1d1b" stroke-width="1.5"/><circle cx="300" cy="380" r="6" fill="#b0bec5" stroke="#1d1d1b" stroke-width="1.5"/><circle cx="520" cy="236" r="6" fill="#b0bec5" stroke="#1d1d1b" stroke-width="1.5"/><circle cx="520" cy="380" r="6" fill="#b0bec5" stroke="#1d1d1b" stroke-width="1.5"/><text x="300" y="300" font-size="12" font-weight="700" text-anchor="middle" fill="#1d1d1b">стяжки</text><text x="40" y="490" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">1. Первый шкаф выставить ножками по лазеру, вдоль и поперёк.</text><text x="40" y="508" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">2. Соседа выставить так же, верх и передние кромки в одну линию.</text><text x="40" y="526" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">3. Только потом зажать струбциной и поставить межсекционные стяжки: 2 на стык, в 30–40 мм от фронта.</text></svg>