<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" width="820" height="540" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Пенал: крепление к стене</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d1d1b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ece7dd"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc8bb" stroke-width="2"/></pattern><pattern id="dsp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="#d7ccc8"/><line x1="0" y1="0" x2="0" y2="6" stroke="#bcaaa4" stroke-width="1"/></pattern></defs><rect width="820" height="540" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#1d1d1b">Пенал: крепление к стене</text><rect x="110" y="60" width="30" height="440" rx="0" fill="url(#hatch)" stroke="#1d1d1b" stroke-width="1.5"/><rect x="110" y="500" width="490" height="14" rx="0" fill="url(#hatch)" stroke="#1d1d1b" stroke-width="1.5"/><line x1="110" y1="60" x2="600" y2="60" stroke="#6f6c66" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="150" y="90" width="230" height="400" rx="0" fill="#fafafa" stroke="#1d1d1b" stroke-width="2"/><text x="265" y="320" font-size="13" font-weight="400" text-anchor="middle" fill="#6f6c66">пенал, разрез</text><path d="M150 104h28v6h-22v22h-6z" fill="#b0bec5" stroke="#1d1d1b" stroke-width="1.5"/><rect x="120" y="106" width="30" height="4" rx="0" fill="#795548" stroke="#1d1d1b" stroke-width="0.5"/><line x1="260" y1="150" x2="176" y2="112" stroke="#1d1d1b" stroke-width="1.6" marker-end="url(#ar)"/><text x="264" y="154" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">уголок к боковине и в стену</text><path d="M380 250l40 -20" stroke="#d84315" stroke-width="3" marker-end="url(#ar)"/><text x="430" y="226" font-size="13" font-weight="400" text-anchor="start" fill="#d84315">без уголка пенал</text><text x="430" y="244" font-size="13" font-weight="400" text-anchor="start" fill="#d84315">опрокидывается вперёд</text><text x="420" y="330" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Два уголка под крышкой,</text><text x="420" y="348" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">дюбель 6–8 мм в стену,</text><text x="420" y="366" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">саморез 4×16 в боковину.</text><text x="420" y="384" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b"></text><text x="420" y="402" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Плюс 3–4 межсекционные</text><text x="420" y="420" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">стяжки с соседним шкафом.</text></svg>