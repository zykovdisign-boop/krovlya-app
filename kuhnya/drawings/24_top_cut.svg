<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Распил столешницы без сколов</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d1d1b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ece7dd"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc8bb" stroke-width="2"/></pattern><pattern id="dsp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="#d7ccc8"/><line x1="0" y1="0" x2="0" y2="6" stroke="#bcaaa4" stroke-width="1"/></pattern></defs><rect width="820" height="440" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#1d1d1b">Распил столешницы без сколов</text><text x="210" y="80" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1d1b">Дисковая пила</text><text x="620" y="80" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1d1b">Лобзик</text><line x1="410" y1="60" x2="410" y2="420" stroke="#e0dcd3" stroke-width="1.5"/><rect x="60" y="200" width="300" height="34" rx="0" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="2"/><rect x="60" y="234" width="300" height="6" rx="0" fill="#795548" stroke="#1d1d1b" stroke-width="1"/><text x="380" y="244" font-size="12" font-weight="700" text-anchor="start" fill="#1d1d1b">лицо вниз</text><circle cx="210" cy="190" r="50" fill="none" stroke="#1d1d1b" stroke-width="2"/><path d="M210 140l6 10h-12z" fill="#1d1d1b"/><line x1="260" y1="160" x2="250" y2="205" stroke="#1565c0" stroke-width="1.6" marker-end="url(#ar)"/><text x="270" y="156" font-size="12" font-weight="400" text-anchor="start" fill="#1565c0">зуб выходит снизу</text><rect x="80" y="240" width="24" height="60" rx="0" fill="#cfd8dc" stroke="#1d1d1b" stroke-width="2"/><rect x="316" y="240" width="24" height="60" rx="0" fill="#cfd8dc" stroke="#1d1d1b" stroke-width="2"/><rect x="190" y="240" width="24" height="60" rx="0" fill="#cfd8dc" stroke="#1d1d1b" stroke-width="2"/><text x="210" y="320" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66">опоры по всей длине</text><rect x="460" y="200" width="300" height="6" rx="0" fill="#795548" stroke="#1d1d1b" stroke-width="1"/><rect x="460" y="206" width="300" height="34" rx="0" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="2"/><text x="620" y="300" font-size="12" font-weight="700" text-anchor="middle" fill="#1d1d1b">лицо вверх, скотч по линии</text><rect x="600" y="120" width="40" height="60" rx="0" fill="#90a4ae" stroke="#1d1d1b" stroke-width="1.5"/><line x1="620" y1="180" x2="620" y2="260" stroke="#1d1d1b" stroke-width="3"/><line x1="660" y1="260" x2="630" y2="230" stroke="#1565c0" stroke-width="1.6" marker-end="url(#ar)"/><text x="664" y="266" font-size="12" font-weight="400" text-anchor="start" fill="#1565c0">пилка обратного зуба:</text><text x="664" y="282" font-size="12" font-weight="400" text-anchor="start" fill="#1565c0">режет при ходе вниз</text><text x="40" y="360" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Зуб пилы рвёт пластик там, где выходит из материала.</text><text x="40" y="378" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Дисковая пила режет снизу вверх, поэтому столешницу кладут лицом вниз.</text><text x="40" y="396" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Обычная пилка лобзика режет вверх и рвёт лицо, поэтому для столешницы пилка обратного зуба.</text><text x="40" y="414" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Срез сразу закройте силиконом: ДСП быстро набирает воду.</text></svg>