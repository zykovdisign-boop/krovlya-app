<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Крепление столешницы</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d1d1b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ece7dd"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc8bb" stroke-width="2"/></pattern><pattern id="dsp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="#d7ccc8"/><line x1="0" y1="0" x2="0" y2="6" stroke="#bcaaa4" stroke-width="1"/></pattern></defs><rect width="820" height="520" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#1d1d1b">Крепление столешницы</text><rect x="60" y="120" width="30" height="300" rx="0" fill="url(#hatch)" stroke="#1d1d1b" stroke-width="1.5"/><rect x="90" y="160" width="520" height="38" rx="0" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="2"/><text x="350" y="150" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66">столешница 38 мм</text><rect x="110" y="198" width="22" height="220" rx="0" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="2"/><rect x="560" y="198" width="22" height="220" rx="0" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="2"/><text x="121" y="438" font-size="11" font-weight="400" text-anchor="middle" fill="#6f6c66">боковина</text><rect x="132" y="198" width="80" height="18" rx="0" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="2"/><rect x="480" y="198" width="80" height="18" rx="0" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="2"/><text x="172" y="234" font-size="11" font-weight="400" text-anchor="middle" fill="#6f6c66">царга</text><rect x="157" y="182" width="6" height="34" rx="0" fill="#b0bec5" stroke="#1d1d1b" stroke-width="1"/><path d="M153 216h14l-7 6z" fill="#b0bec5" stroke="#1d1d1b"/><rect x="517" y="182" width="6" height="34" rx="0" fill="#b0bec5" stroke="#1d1d1b" stroke-width="1"/><path d="M513 216h14l-7 6z" fill="#b0bec5" stroke="#1d1d1b"/><line x1="640" y1="160" x2="640" y2="198" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="648" y="184" font-size="12" font-weight="700" text-anchor="start" fill="#1d1d1b">38</text><line x1="700" y1="182" x2="700" y2="216" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="708" y="204" font-size="12" font-weight="700" text-anchor="start" fill="#1d1d1b">30</text><text x="720" y="260" font-size="12" font-weight="400" text-anchor="start" fill="#1d1d1b">саморез 4×30:</text><text x="720" y="276" font-size="12" font-weight="400" text-anchor="start" fill="#1d1d1b">царга 16 + 14 мм</text><text x="720" y="292" font-size="12" font-weight="400" text-anchor="start" fill="#1d1d1b">в столешнице</text><rect x="84" y="140" width="10" height="20" rx="0" fill="#1565c0" stroke="#1565c0" stroke-width="0.5"/><rect x="94" y="134" width="40" height="26" rx="0" fill="#cfd8dc" stroke="#1d1d1b" stroke-width="1.2"/><text x="114" y="124" font-size="11" font-weight="400" text-anchor="middle" fill="#1d1d1b">плинтус</text><line x1="60" y1="100" x2="88" y2="150" stroke="#1565c0" stroke-width="1.6" marker-end="url(#ar)"/><text x="56" y="96" font-size="12" font-weight="400" text-anchor="end" fill="#1565c0">силикон</text><text x="40" y="470" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Саморез короче, чем толщина царги плюс столешницы: иначе острие выйдет наверх.</text><text x="40" y="488" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">По 2 самореза на каждую царгу. Нет царг — мебельные уголки к боковинам.</text></svg>