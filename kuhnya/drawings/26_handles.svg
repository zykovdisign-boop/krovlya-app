<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Ручки: разметка и сверление</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d1d1b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ece7dd"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc8bb" stroke-width="2"/></pattern><pattern id="dsp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="#d7ccc8"/><line x1="0" y1="0" x2="0" y2="6" stroke="#bcaaa4" stroke-width="1"/></pattern></defs><rect width="820" height="520" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#1d1d1b">Ручки: разметка и сверление</text><rect x="80" y="100" width="260" height="380" rx="0" fill="#fafafa" stroke="#1d1d1b" stroke-width="2"/><text x="210" y="90" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66">фасад</text><rect x="80" y="130" width="120" height="50" rx="4" fill="#ffe082" stroke="#1d1d1b" stroke-width="1.5"/><text x="140" y="160" font-size="12" font-weight="700" text-anchor="middle" fill="#1d1d1b">шаблон</text><circle cx="110" cy="155" r="5" fill="#fff" stroke="#1d1d1b" stroke-width="1.5"/><circle cx="174" cy="155" r="5" fill="#fff" stroke="#1d1d1b" stroke-width="1.5"/><line x1="110" y1="200" x2="174" y2="200" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="142" y="192" font-size="12" font-weight="700" text-anchor="middle" fill="#1d1d1b">96 / 128 / 160</text><text x="470" y="90" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1d1b">Сверление с подложкой</text><rect x="400" y="200" width="300" height="22" rx="0" fill="#fafafa" stroke="#1d1d1b" stroke-width="1.5"/><rect x="400" y="222" width="300" height="30" rx="0" fill="url(#dsp)" stroke="#1d1d1b" stroke-width="2"/><text x="720" y="216" font-size="12" font-weight="400" text-anchor="start" fill="#1d1d1b">фасад</text><text x="720" y="244" font-size="12" font-weight="400" text-anchor="start" fill="#1d1d1b">подложка</text><line x1="550" y1="130" x2="550" y2="236" stroke="#1d1d1b" stroke-width="5"/><rect x="536" y="100" width="28" height="30" rx="0" fill="#90a4ae" stroke="#1d1d1b" stroke-width="1.5"/><text x="580" y="150" font-size="12" font-weight="400" text-anchor="start" fill="#1d1d1b">сверло 4,5–5</text><text x="400" y="310" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Подложка из обрезка ДСП не даёт</text><text x="400" y="328" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">сверлу вырвать облицовку на выходе.</text><text x="400" y="346" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b"></text><text x="400" y="364" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Винт М4: толщина фасада + 6–8 мм.</text><text x="400" y="382" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b"></text><text x="400" y="400" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Верхние шкафы: ручка внизу дверцы,</text><text x="400" y="418" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">нижние: вверху, ящики: по центру.</text></svg>