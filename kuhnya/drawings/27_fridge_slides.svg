<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Встроенный холодильник: салазки</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d1d1b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ece7dd"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc8bb" stroke-width="2"/></pattern><pattern id="dsp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="#d7ccc8"/><line x1="0" y1="0" x2="0" y2="6" stroke="#bcaaa4" stroke-width="1"/></pattern></defs><rect width="820" height="560" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#1d1d1b">Встроенный холодильник: салазки</text><rect x="120" y="90" width="200" height="420" rx="8" fill="#eceff1" stroke="#1d1d1b" stroke-width="2"/><text x="220" y="300" font-size="14" font-weight="700" text-anchor="middle" fill="#1d1d1b">дверь</text><text x="220" y="318" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66">холодильника</text><rect x="330" y="80" width="22" height="440" rx="0" fill="#fafafa" stroke="#1d1d1b" stroke-width="2"/><text x="341" y="540" font-size="12" font-weight="700" text-anchor="middle" fill="#1d1d1b">фасад</text><rect x="300" y="150" width="30" height="14" rx="0" fill="#b0bec5" stroke="#1d1d1b" stroke-width="1.2"/><rect x="306" y="140" width="24" height="34" rx="3" fill="#90a4ae" stroke="#1d1d1b" stroke-width="1.2"/><line x1="400" y1="157" x2="336" y2="157" stroke="#1d1d1b" stroke-width="1.6" marker-end="url(#ar)"/><rect x="300" y="430" width="30" height="14" rx="0" fill="#b0bec5" stroke="#1d1d1b" stroke-width="1.2"/><rect x="306" y="420" width="24" height="34" rx="3" fill="#90a4ae" stroke="#1d1d1b" stroke-width="1.2"/><line x1="400" y1="437" x2="336" y2="437" stroke="#1d1d1b" stroke-width="1.6" marker-end="url(#ar)"/><text x="408" y="160" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">салазка: часть на двери,</text><text x="408" y="178" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">ползун на фасаде</text><text x="408" y="260" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Фасад висит на петлях шкафа,</text><text x="408" y="278" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">дверь едет вместе с ним по салазкам.</text><text x="408" y="296" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b"></text><text x="408" y="314" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Фасад выставляют по соседним,</text><text x="408" y="332" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">потом проверяют, что уплотнитель</text><text x="408" y="350" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">двери прилегает по всему периметру.</text></svg>