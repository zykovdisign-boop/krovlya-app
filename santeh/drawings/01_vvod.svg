rect x="235" y="134" width="40" height="32" rx="6" fill="#fff" stroke="#1d1d1b" stroke-width="2"/><circle cx="255" cy="150" r="10" fill="none" stroke="#1d1d1b" stroke-width="1.5"/><text x="255" y="154" font-size="10" font-weight="700" text-anchor="middle" fill="#1d1d1b">м³</text><circle cx="255" cy="212" r="11" fill="#1d1d1b"/><text x="255" y="217" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">3</text><rect x="321" y="138" width="28" height="24" rx="3" fill="#fff" stroke="#1d1d1b" stroke-width="2"/><path d="M328 143L340 150L328 157z" fill="#1d1d1b"/><line x1="342" y1="142" x2="342" y2="158" stroke="#1d1d1b" stroke-width="2.5"/><circle cx="335" cy="212" r="11" fill="#1d1d1b"/><text x="335" y="217" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">4</text><rect x="398" y="132" width="44" height="36" rx="6" fill="#fff" stroke="#1d1d1b" stroke-width="2"/><text x="420" y="155" font-size="16" font-weight="700" text-anchor="middle" fill="#1d1d1b">Р</text><circle cx="420" cy="212" r="11" fill="#1d1d1b"/><text x="420" y="217" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">5</text><line x1="495" y1="150" x2="495" y2="128" stroke="#1d1d1b" stroke-width="3"/><circle cx="495" cy="116" r="12" fill="#fff" stroke="#1d1d1b" stroke-width="2"/><line x1="495" y1="116" x2="501" y2="110" stroke="#e53935" stroke-width="2"/><circle cx="495" cy="212" r="11" fill="#1d1d1b"/><text x="495" y="217" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">6</text><rect x="559" y="116" width="32" height="68" rx="8" fill="#fff" stroke="#1d1d1b" stroke-width="2"/><line x1="567" y1="128" x2="567" y2="174" stroke="#6f6c66" stroke-dasharray="3 3"/><line x1="583" y1="128" x2="583" y2="174" stroke="#6f6c66" stroke-dasharray="3 3"/><circle cx="575" cy="212" r="11" fill="#1d1d1b"/><text x="575" y="217" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">7</text><rect x="640" y="128" width="140" height="44" rx="6" fill="#fff" stroke="#1d1d1b" stroke-width="2"/><text x="710" y="120" font-size="14" font-weight="700" text-anchor="middle" fill="#1d1d1b">Коллектор</text><polyline points="670,172 670,220" fill="none" stroke="#1565c0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M660 184L680 208L660 208L680 184z" fill="#fff" stroke="#1d1d1b" stroke-width="2"/><circle cx="670" cy="196" r="3.5" fill="#1d1d1b"/><polyline points="710,172 710,220" fill="none" stroke="#1565c0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M700 184L720 208L700 208L720 184z" fill="#fff" stroke="#1d1d1b" stroke-width="2"/><circle cx="710" cy="196" r="3.5" fill="#1d1d1b"/><polyline points="750,172 750,220" fill="none" stroke="#1565c0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M740 184L760 208L740 208L760 184z" fill="#fff" stroke="#1d1d1b" stroke-width="2"/><circle cx="750" cy="196" r="3.5" fill="#1d1d1b"/><text x="710" y="242" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66">на приборы</text><path d="M54 144L66 150L54 156" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M124 144L136 150L124 156" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M294 144L306 150L294 156" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M374 144L386 150L374 156" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M529 144L541 150L529 156" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="290" font-size="14" font-weight="400" text-anchor="start" fill="#1d1d1b">1. Кран шаровый</text><text x="40" y="308" font-size="14" font-weight="400" text-anchor="start" fill="#1d1d1b">2. Фильтр грубой очистки</text><text x="40" y="326" font-size="14" font-weight="400" text-anchor="start" fill="#1d1d1b">3. Счётчик</text><text x="40" y="344" font-size="14" font-weight="400" text-anchor="start" fill="#1d1d1b">4. Обратный клапан</text><text x="330" y="290" font-size="14" font-weight="400" text-anchor="start" fill="#1d1d1b">5. Редуктор давления</text><text x="330" y="308" font-size="14" font-weight="400" text-anchor="start" fill="#1d1d1b">6. Манометр</text><text x="330" y="326" font-size="14" font-weight="400" text-anchor="start" fill="#1d1d1b">7. Фильтр тонкой очистки</text><text x="40" y="385" font-size="13" font-weight="400" text-anchor="start" fill="#6f6c66">Фильтр грубой очистки стоит перед счётчиком и редуктором: грязь из трубы забивает их первыми.</text><text x="40" y="402" font-size="13" font-weight="400" text-anchor="start" fill="#6f6c66">Редуктор настраивают на 3–4 бар. Манометр сразу за ним показывает, держит ли он давление.</text></svg>