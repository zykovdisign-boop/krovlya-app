<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Тройниковая и коллекторная разводка</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d1d1b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ece7dd"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc8bb" stroke-width="2"/></pattern></defs><rect width="800" height="400" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#1d1d1b">Тройниковая и коллекторная разводка</text><text x="200" y="80" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1d1b">Тройниковая (последовательная)</text><text x="600" y="80" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1d1b">Коллекторная (лучевая)</text><line x1="400" y1="60" x2="400" y2="380" stroke="#e0dcd3" stroke-width="1.5"/><polyline points="40,140 360,140" fill="none" stroke="#1565c0" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><polyline points="90,140 90,220" fill="none" stroke="#1565c0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="90" cy="140" r="6" fill="#1d1d1b"/><path d="M76 222h28v10h-6v8h-16v-8h-6z" fill="#eceff1" stroke="#1d1d1b" stroke-width="1.6"/><text x="90" y="258" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66">Ванна</text><polyline points="170,140 170,220" fill="none" stroke="#1565c0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="170" cy="140" r="6" fill="#1d1d1b"/><path d="M156 222h28v10h-6v8h-16v-8h-6z" fill="#eceff1" stroke="#1d1d1b" stroke-width="1.6"/><text x="170" y="258" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66">Раковина</text><polyline points="250,140 250,220" fill="none" stroke="#1565c0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="250" cy="140" r="6" fill="#1d1d1b"/><path d="M236 222h28v10h-6v8h-16v-8h-6z" fill="#eceff1" stroke="#1d1d1b" stroke-width="1.6"/><text x="250" y="258" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66">Унитаз</text><polyline points="330,140 330,220" fill="none" stroke="#1565c0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="330" cy="140" r="6" fill="#1d1d1b"/><path d="M316 222h28v10h-6v8h-16v-8h-6z" fill="#eceff1" stroke="#1d1d1b" stroke-width="1.6"/><text x="330" y="258" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66">Кухня</text><text x="40" y="128" font-size="12" font-weight="400" text-anchor="start" fill="#6f6c66">стояк</text><rect x="450" y="120" width="300" height="36" rx="6" fill="#fff" stroke="#1d1d1b" stroke-width="2"/><text x="600" y="143" font-size="13" font-weight="700" text-anchor="middle" fill="#1d1d1b">Коллектор</text><polyline points="485,156 485,220" fill="none" stroke="#1565c0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M475 174L495 198L475 198L495 174z" fill="#fff" stroke="#1d1d1b" stroke-width="2"/><circle cx="485" cy="186" r="3.5" fill="#1d1d1b"/><path d="M471 222h28v10h-6v8h-16v-8h-6z" fill="#eceff1" stroke="#1d1d1b" stroke-width="1.6"/><text x="485" y="258" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66">Ванна</text><polyline points="562,156 562,220" fill="none" stroke="#1565c0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M552 174L572 198L552 198L572 174z" fill="#fff" stroke="#1d1d1b" stroke-width="2"/><circle cx="562" cy="186" r="3.5" fill="#1d1d1b"/><path d="M548 222h28v10h-6v8h-16v-8h-6z" fill="#eceff1" stroke="#1d1d1b" stroke-width="1.6"/><text x="562" y="258" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66">Раковина</text><polyline points="639,156 639,220" fill="none" stroke="#1565c0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M629 174L649 198L629 198L649 174z" fill="#fff" stroke="#1d1d1b" stroke-width="2"/><circle cx="639" cy="186" r="3.5" fill="#1d1d1b"/><path d="M625 222h28v10h-6v8h-16v-8h-6z" fill="#eceff1" stroke="#1d1d1b" stroke-width="1.6"/><text x="639" y="258" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66">Унитаз</text><polyline points="716,156 716,220" fill="none" stroke="#1565c0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M706 174L726 198L706 198L726 174z" fill="#fff" stroke="#1d1d1b" stroke-width="2"/><circle cx="716" cy="186" r="3.5" fill="#1d1d1b"/><path d="M702 222h28v10h-6v8h-16v-8h-6z" fill="#eceff1" stroke="#1d1d1b" stroke-width="1.6"/><text x="716" y="258" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66">Кухня</text><polyline points="420,138 450,138" fill="none" stroke="#1565c0" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><text x="40" y="300" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">+ меньше трубы и проще монтаж</text><text x="40" y="317" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">− включили кухню — прыгает температура в душе</text><text x="40" y="334" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">− перекрыть один прибор нельзя</text><text x="40" y="351" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Подходит для маленькой квартиры</text><text x="430" y="300" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">+ ровное давление на каждом приборе</text><text x="430" y="317" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">+ любой прибор перекрывается отдельно</text><text x="430" y="334" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">+ соединений в стене нет</text><text x="430" y="351" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">− трубы больше в 1,5–2 раза</text></svg>