<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Циркуляция горячей воды</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d1d1b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ece7dd"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc8bb" stroke-width="2"/></pattern></defs><rect width="800" height="520" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#1d1d1b">Циркуляция горячей воды</text><rect x="40" y="110" width="110" height="200" rx="30" fill="#fff" stroke="#1d1d1b" stroke-width="2"/><text x="95" y="197" font-size="13" font-weight="700" text-anchor="middle" fill="#1d1d1b">Бойлер</text><text x="95" y="214" font-size="13" font-weight="700" text-anchor="middle" fill="#1d1d1b">косвенного</text><text x="95" y="231" font-size="13" font-weight="700" text-anchor="middle" fill="#1d1d1b">нагрева</text><polyline points="10,290 40,290" fill="none" stroke="#1565c0" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><text x="14" y="280" font-size="12" font-weight="700" text-anchor="start" fill="#1565c0">ХВС</text><polyline points="150,140 740,140 740,250" fill="none" stroke="#e53935" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><polyline points="260,140 260,190" fill="none" stroke="#e53935" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="260" cy="140" r="6" fill="#e53935"/><path d="M246 192h28v10h-6v8h-16v-8h-6z" fill="#eceff1" stroke="#1d1d1b" stroke-width="1.6"/><text x="260" y="228" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66">Кухня</text><polyline points="420,140 420,190" fill="none" stroke="#e53935" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="420" cy="140" r="6" fill="#e53935"/><path d="M406 192h28v10h-6v8h-16v-8h-6z" fill="#eceff1" stroke="#1d1d1b" stroke-width="1.6"/><text x="420" y="228" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66">Ванна</text><polyline points="580,140 580,190" fill="none" stroke="#e53935" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="580" cy="140" r="6" fill="#e53935"/><path d="M566 192h28v10h-6v8h-16v-8h-6z" fill="#eceff1" stroke="#1d1d1b" stroke-width="1.6"/><text x="580" y="228" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66">Душ</text><rect x="710" y="200" width="60" height="60" rx="6" fill="none" stroke="#e53935" stroke-width="5"/><line x1="716" y1="220" x2="764" y2="220" stroke="#e53935" stroke-width="4"/><line x1="716" y1="240" x2="764" y2="240" stroke="#e53935" stroke-width="4"/><text x="740" y="285" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66">полотенцесушитель</text><polyline points="740,260 740,330 150,330 150,290" fill="none" stroke="#1e88e5" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="380" cy="330" r="17" fill="#fff" stroke="#1d1d1b" stroke-width="2"/><path d="M387 321L370 330L387 339z" fill="#1d1d1b"/><circle cx="380" cy="372" r="11" fill="#1d1d1b"/><text x="380" y="377" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">1</text><rect x="286" y="318" width="28" height="24" rx="3" fill="#fff" stroke="#1d1d1b" stroke-width="2"/><path d="M307 323L295 330L307 337z" fill="#1d1d1b"/><line x1="293" y1="322" x2="293" y2="338" stroke="#1d1d1b" stroke-width="2.5"/><circle cx="300" cy="372" r="11" fill="#1d1d1b"/><text x="300" y="377" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">2</text><path d="M448 320L472 340L472 320L448 340z" fill="#fff" stroke="#1d1d1b" stroke-width="2"/><circle cx="460" cy="330" r="3.5" fill="#1d1d1b"/><line x1="460" y1="330" x2="460" y2="310" stroke="#1d1d1b" stroke-width="2.5"/><line x1="452" y1="310" x2="468" y2="310" stroke="#1d1d1b" stroke-width="3" stroke-linecap="round"/><circle cx="460" cy="372" r="11" fill="#1d1d1b"/><text x="460" y="377" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">3</text><path d="M194 134L206 140L194 146" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M654 134L666 140L654 146" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M606 324L594 330L606 336" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M226 324L214 330L226 336" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="500" y1="380" x2="530" y2="380" stroke="#e53935" stroke-width="5" stroke-linecap="round"/><text x="540" y="385" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">подача горячей воды</text><line x1="500" y1="402" x2="530" y2="402" stroke="#1e88e5" stroke-width="5" stroke-linecap="round"/><text x="540" y="407" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">обратка циркуляции</text><text x="40" y="400" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">1. Насос циркуляции, лучше с таймером</text><text x="40" y="417" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">2. Обратный клапан сразу за насосом</text><text x="40" y="434" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">3. Кран для обслуживания насоса</text><text x="40" y="480" font-size="13" font-weight="400" text-anchor="start" fill="#6f6c66">Петля проходит мимо всех точек, обратка возвращается в нижнюю треть бойлера.</text><text x="40" y="497" font-size="13" font-weight="400" text-anchor="start" fill="#6f6c66">Горячая вода в кране через 2–3 секунды, без слива холодной.</text></svg>