<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 590" width="800" height="590" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Обвязка котла</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d1d1b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ece7dd"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc8bb" stroke-width="2"/></pattern></defs><rect width="800" height="590" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#1d1d1b">Обвязка котла</text><rect x="40" y="120" width="120" height="200" rx="6" fill="#fff" stroke="#1d1d1b" stroke-width="2"/><text x="100" y="225" font-size="16" font-weight="700" text-anchor="middle" fill="#1d1d1b">Котёл</text><polyline points="160,150 700,150 700,200" fill="none" stroke="#e53935" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><text x="700" y="140" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66">к радиаторам</text><polyline points="700,280 700,330 160,330 160,300" fill="none" stroke="#1e88e5" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><text x="700" y="360" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66">от радиаторов</text><rect x="650" y="200" width="98" height="80" rx="4" fill="#fafafa" stroke="#1d1d1b" stroke-width="2"/><line x1="664" y1="204" x2="664" y2="276" stroke="#1d1d1b" stroke-width="1.2"/><line x1="678" y1="204" x2="678" y2="276" stroke="#1d1d1b" stroke-width="1.2"/><line x1="692" y1="204" x2="692" y2="276" stroke="#1d1d1b" stroke-width="1.2"/><line x1="706" y1="204" x2="706" y2="276" stroke="#1d1d1b" stroke-width="1.2"/><line x1="720" y1="204" x2="720" y2="276" stroke="#1d1d1b" stroke-width="1.2"/><line x1="734" y1="204" x2="734" y2="276" stroke="#1d1d1b" stroke-width="1.2"/><polyl