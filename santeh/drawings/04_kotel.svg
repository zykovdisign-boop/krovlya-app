24L634 330L646 336" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M296 324L284 330L296 336" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="560" y1="420" x2="590" y2="420" stroke="#e53935" stroke-width="5" stroke-linecap="round"/><text x="600" y="425" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">подача</text><line x1="560" y1="442" x2="590" y2="442" stroke="#1e88e5" stroke-width="5" stroke-linecap="round"/><text x="600" y="447" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">обратка</text><text x="40" y="460" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">1. Группа безопасности: манометр, клапан на 3 бар, воздухоотводчик</text><text x="40" y="477" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">2. Кран на подаче  3. Кран на обратке</text><text x="40" y="494" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">4. Расширительный бак на обратке перед насосом</text><text x="40" y="511" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">5. Сетчатый фильтр  6. Насос  7. Кран для замены насоса</text><text x="40" y="560" font-size="13" font-weight="400" text-anchor="start" fill="#6f6c66">У настенного газового котла насос, бак и группа часто уже внутри — проверьте паспорт.</text></svg>