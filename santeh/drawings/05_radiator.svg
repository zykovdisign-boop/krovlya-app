<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Подключение радиатора</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d1d1b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ece7dd"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc8bb" stroke-width="2"/></pattern></defs><rect width="800" height="420" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#1d1d1b">Подключение радиатора</text><rect x="90" y="110" width="144" height="90" rx="4" fill="#fafafa" stroke="#1d1d1b" stroke-width="2"/><line x1="106" y1="114" x2="106" y2="196" stroke="#1d1d1b" stroke-width="1.2"/><line x1="122" y1="114" x2="122" y2="196" stroke="#1d1d1b" stroke-width="1.2"/><line x1="138" y1="114" x2="138" y2="196" stroke="#1d1d1b" stroke-width="1.2"/><line x1="154" y1="114" x2="154" y2="196" stroke="#1d1d1b" stroke-width="1.2"/><line x1="170" y1="114" x2="170" y2="196" stroke="#1d1d1b" stroke-width="1.2"/><line x1="186" y1="114" x2="186" y2="196" stroke="#1d1d1b" stroke-width="1.2"/><line x1="202" y1="114" x2="202" y2="196" stroke="#1d1d1b" stroke-width="1.2"/><line x1="218" y1="114" x2="218" y2="196" stroke="#1d1d1b" stroke-width="1.2"/><polyline points="48,250 48,128 90,128" fill="none" stroke="#e53935" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="60,250 60,182 90,182" fill="none" stroke="#1e88e5" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="162" y="290" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1d1b">Боковое</text><text x="162" y="312" font-size="13" font-weight="400" text-anchor="middle" fill="#6f6c66">теплоотдача ≈ 97 %</text><rect x="340" y="110" width="144" height="90" rx=