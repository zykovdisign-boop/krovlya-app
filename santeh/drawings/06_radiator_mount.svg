<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Установка радиатора: зазоры</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d1d1b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ece7dd"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc8bb" stroke-width="2"/></pattern></defs><rect width="800" height="460" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#1d1d1b">Установка радиатора: зазоры</text><rect x="80" y="70" width="40" height="330" fill="url(#hatch)" stroke="#1d1d1b" stroke-width="1.5"/><text x="100" y="420" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66">стена</text><rect x="40" y="400" width="520" height="22" fill="url(#hatch)" stroke="#1d1d1b" stroke-width="1.5"/><text x="520" y="440" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66">пол</text><rect x="120" y="120" width="230" height="18" fill="#f4f1ea" stroke="#1d1d1b" stroke-width="2"/><text x="250" y="112" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66">подоконник</text><rect x="160" y="190" width="60" height="160" rx="6" fill="#fafafa" stroke="#1d1d1b" stroke-width="2"/><line x1="168" y1="198" x2="168" y2="342" stroke="#1d1d1b" stroke-width="1"/><line x1="182" y1="198" x2="182" y2="342" stroke="#1d1d1b" stroke-width="1"/><line x1="196" y1="198" x2="196" y2="342" stroke="#1d1d1b" stroke-width="1"/><line x1="210" y1="198" x2="210" y2="342" stroke="#1d1d1b" stroke-width="1"/><path d="M120 230h40M120 310h40" stroke="#1d1d1b" stroke-width="3"/><line x1="300" y1="300" x2="150" y2="312" stroke="#6f6c66" stroke-width="1.6" marker-end="url(#ar)"/><text x="306" y="304" font-size="12" font-weight="400" text-anchor="start" fill="#6f6c66">кронштейн</text><line x1="250" y1="138" x2="250" y2="190" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="258" y="169" font-size="14" font-weight="700" text-anchor="start" fill="#1d1d1b">10–12 см</text><line x1="250" y1="350" x2="250" y2="400" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="258" y="380" font-size="14" font-weight="700" text-anchor="start" fill="#1d1d1b">10–12 см</text><line x1="120" y1="375" x2="160" y2="375" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="140" y="367" font-size="14" font-weight="700" text-anchor="middle" fill="#1d1d1b">3–5 см</text><text x="420" y="180" font-size="14" font-weight="400" text-anchor="start" fill="#1d1d1b">Ширина радиатора — 50–75 %</text><text x="420" y="198" font-size="14" font-weight="400" text-anchor="start" fill="#1d1d1b">ширины окна. Тёплый воздух</text><text x="420" y="216" font-size="14" font-weight="400" text-anchor="start" fill="#1d1d1b">поднимается и закрывает окно</text><text x="420" y="234" font-size="14" font-weight="400" text-anchor="start" fill="#1d1d1b">от холода, стекло не потеет.</text><text x="420" y="252" font-size="14" font-weight="400" text-anchor="start" fill="#1d1d1b"></text><text x="420" y="270" font-size="14" font-weight="400" text-anchor="start" fill="#1d1d1b">Экран и плотные шторы</text><text x="420" y="288" font-size="14" font-weight="400" text-anchor="start" fill="#1d1d1b">забирают до 15 % тепла.</text></svg>