<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" width="800" height="490" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Тёплый пол: улитка и змейка</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d1d1b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ece7dd"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc8bb" stroke-width="2"/></pattern></defs><rect width="800" height="490" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#1d1d1b">Тёплый пол: улитка и змейка</text><rect x="60" y="90" width="280" height="240" fill="#fffdf6" stroke="#1d1d1b" stroke-width="2"/><rect x="440" y="90" width="280" height="240" fill="#fffdf6" stroke="#1d1d1b" stroke-width="2"/><polyline points="80,360 80,310 80,110 320,110 320,310 120,310 120,270 120,150 280,150 280,270 160,270 160,230 160,190 240,190 240,230 200,230" fill="none" stroke="#e53935" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline points="200,230 180,250" fill="none" stroke="#ef6c00" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline points="180,250 260,250 260,170 140,170 140,250 140,290 300,290 300,130 100,130 100,290 100,360" fill="none" stroke="#1e88e5" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline points="470,330 470,110 508,110 508,310 546,310 546,110 584,110 584,310 622,310 622,110 660,110 660,310 698,310 698,110" fill="none" stroke="#e53935" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><rect x="440" y="80" width="280" height="10" fill="#90caf9"/><text x="580" y="74" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66">окно / холодная стена</text><text x="200" y="360" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1d1b">Улитка</text><text x="200" y="380" font-size="13" font-weight="400" text-anchor="middle" fill="#6f6c66">температура пола ровная</text><text x="580" y="360" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1d1b">Змейка</text><text x="580" y="380" font-size="13" font-weight="400" text-anchor="middle" fill="#6f6c66">у холодной стены, начинать от окна</text><text x="60" y="420" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Шаг трубы: 150 мм в жилых комнатах и ванной, 100 мм у окон, 200 мм в коридоре.</text><text x="60" y="437" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Длина одного контура из трубы 16 мм — не больше 80–100 м. Расход трубы ≈ 1 / шаг: при шаге 150 мм около 6,7 м на м².</text><text x="60" y="454" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Демпферная лента по периметру и между контурами обязательна.</text></svg>