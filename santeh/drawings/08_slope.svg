<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" width="800" height="510" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Уклоны канализации</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d1d1b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ece7dd"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc8bb" stroke-width="2"/></pattern></defs><rect width="800" height="510" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#1d1d1b">Уклоны канализации</text><rect x="40" y="80" width="40" height="300" fill="url(#hatch)" stroke="#1d1d1b" stroke-width="1.5"/><rect x="80" y="80" width="46" height="300" fill="#eceff1" stroke="#1d1d1b" stroke-width="2"/><text x="103" y="400" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66">стояк Ø110</text><path d="M126 268L660 200" stroke="#1d1d1b" stroke-width="24" stroke-linecap="butt"/><path d="M126 268L660 200" stroke="#eceff1" stroke-width="20"/><path d="M130 276L660 208" stroke="#90caf9" stroke-width="6" opacity=".8"/><line x1="380" y1="236" x2="660" y2="236" stroke="#6f6c66" stroke-dasharray="5 4"/><line x1="640" y1="236" x2="640" y2="203" stroke="#1d1d1b" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="648" y="224.5" font-size="14" font-weight="700" text-anchor="start" fill="#1d1d1b">уклон</text><text x="560" y="300" font-size="15" font-weight="700" text-anchor="start" fill="#1d1d1b">Ø50 — 3 см на 1 м</text><text x="560" y="319" font-size="15" font-weight="700" text-anchor="start" fill="#1d1d1b">Ø110 — 2 см на 1 м</text><text x="560" y="338" font-size="15" font-weight="700" text-anchor="start" fill="#1d1d1b">не больше 3,5 см на 1 м</text><text x="400" y="180" font-size="13" font-weight="400" text-anchor="middle" fill="#6f6c66">от раковины, ванны, стиралки</text><line x1="480" y1="190" x2="300" y2="232" stroke="#6f6c66" stroke-width="1.6" marker-end="url(#ar)"/><text x="40" y="440" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Мало уклона — вода стоит и откладывается жир. Слишком много — вода убегает, а твёрдое остаётся.</text><text x="40" y="457" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Уклон держат ровным на всей длине: провисание в одном месте — будущий засор.</text><text x="40" y="474" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Повороты — двумя отводами по 45°, ревизия на каждом повороте лежака и внизу стояка.</text></svg>