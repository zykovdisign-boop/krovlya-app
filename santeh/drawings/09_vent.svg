<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Гидрозатвор и вентиляция стояка</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d1d1b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ece7dd"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc8bb" stroke-width="2"/></pattern></defs><rect width="800" height="480" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#1d1d1b">Гидрозатвор и вентиляция стояка</text><rect x="560" y="60" width="50" height="300" fill="#eceff1" stroke="#1d1d1b" stroke-width="2"/><text x="585" y="380" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66">стояк</text><path d="M560 60h50" stroke="#1d1d1b" stroke-width="2"/><path d="M570 60v-20h30v20" fill="none" stroke="#1d1d1b" stroke-width="2"/><line x1="640" y1="50" x2="610" y2="50" stroke="#1d1d1b" stroke-width="1.6" marker-end="url(#ar)"/><text x="650" y="46" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">выход на крышу</text><text x="650" y="63" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">или воздушный клапан</text><path d="M80 140h180l-20 50h-140z" fill="#f5f5f5" stroke="#1d1d1b" stroke-width="2"/><text x="170" y="130" font-size="12" font-weight="400" text-anchor="middle" fill="#6f6c66">раковина</text><path d="M160 190v80a30 30 0 0060 0v-30" fill="none" stroke="#1d1d1b" stroke-width="18" stroke-linecap="round"/><path d="M160 190v80a30 30 0 0060 0v-30" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"/><path d="M160 250v20a30 30 0 0060 0v-20" fill="none" stroke="#64b5f6" stroke-width="11"/><path d="M220 240h340" stroke="#1d1d1b" stroke-width="18"/><path d="M220 240h340" stroke="#fff" stroke-width="13"/><line x1="300" y1="330" x2="205" y2="290" stroke="#1d1d1b" stroke-width="1.6" marker-end="url(#ar)"/><text x="305" y="334" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">гидрозатвор: вода в колене</text><text x="305" y="351" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">не пускает запах из трубы</text><text x="40" y="420" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Унитаз сбрасывает сразу 6 литров, в стояке получается поршень и разрежение.</text><text x="40" y="437" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Если стояку неоткуда взять воздух, он тянет его через сифоны и высасывает из них воду.</text><text x="40" y="454" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">Отсюда запах и бульканье в раковине. Лечится выходом стояка на крышу или воздушным клапаном.</text></svg>