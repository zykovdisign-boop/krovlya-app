<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Однотрубная и двухтрубная система</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d1d1b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ece7dd"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc8bb" stroke-width="2"/></pattern></defs><rect width="800" height="480" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#1d1d1b">Однотрубная и двухтрубная система</text><text x="200" y="80" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1d1b">Однотрубная («ленинградка»)</text><text x="600" y="80" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1d1b">Двухтрубная</text><line x1="400" y1="60" x2="400" y2="400" stroke="#e0dcd3" stroke-width="1.5"/><polyline points="40,300 40,250 360,250 360,330 40,330" fill="none" stroke="#e53935" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><rect x="60" y="140" width="60" height="60" rx="4" fill="#fafafa" stroke="#1d1d1b" stroke-width="2"/><line x1="75" y1="144" x2="75" y2="196" stroke="#1d1d1b" stroke-width="1.2"/><line x1="90" y1="144" x2="90" y2="196" stroke="#1d1d1b" stroke-width="1.2"/><line x1="105" y1="144" x2="105" y2="196" stroke="#1d1d1b" stroke-width="1.2"/><polyline points="65,250 65,160 60,160" fill="none" stroke="#e53935" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline points="125,250 125,190 120,190" fill="none" stroke="#ef6c00" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="90" y="230" font-size="10" font-weight="400" text-anchor="middle" fill="#6f6c66">байпас</text><rect x="170" y="140" width="60" height="60" rx="4" fill="#fafafa" stroke="#1d1d1b" stroke-width="2"/><line x1="185" y1="144" x2="185" y2="196" stroke="#1d1d1b" stroke-width="1.2"/><line x1="200" y1="144" x2="200" y2="196" stroke="#1d1d1b" stroke-width="1.2"/><line x1="215" y1="144" x2="215" y2="196" stroke="#1d1d1b" stroke-width="1.2"/><polyline points="175,250 175,160 170,160" fill="none" stroke="#ef6c00" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline points="235,250 235,190 230,190" fill="none" stroke="#ef6c00" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="200" y="230" font-size="10" font-weight="400" text-anchor="middle" fill="#6f6c66">байпас</text><rect x="280" y="140" width="60" height="60" rx="4" fill="#fafafa" stroke="#1d1d1b" stroke-width="2"/><line x1="295" y1="144" x2="295" y2="196" stroke="#1d1d1b" stroke-width="1.2"/><line x1="310" y1="144" x2="310" y2="196" stroke="#1d1d1b" stroke-width="1.2"/><line x1="325" y1="144" x2="325" y2="196" stroke="#1d1d1b" stroke-width="1.2"/><polyline points="285,250 285,160 280,160" fill="none" stroke="#ef6c00" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline points="345,250 345,190 340,190" fill="none" stroke="#ef6c00" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="310" y="230" font-size="10" font-weight="400" text-anchor="middle" fill="#6f6c66">байпас</text><text x="40" y="370" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">+ одна труба, дешевле</text><text x="40" y="387" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">− каждый следующий радиатор холоднее</text><text x="40" y="404" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">− без байпасов термоголовки не поставить</text><polyline points="430,250 760,250" fill="none" stroke="#e53935" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="430,300 760,300" fill="none" stroke="#1e88e5" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><rect x="460" y="140" width="60" height="60" rx="4" fill="#fafafa" stroke="#1d1d1b" stroke-width="2"/><line x1="475" y1="144" x2="475" y2="196" stroke="#1d1d1b" stroke-width="1.2"/><line x1="490" y1="144" x2="490" y2="196" stroke="#1d1d1b" stroke-width="1.2"/><line x1="505" y1="144" x2="505" y2="196" stroke="#1d1d1b" stroke-width="1.2"/><polyline points="465,250 465,160 460,160" fill="none" stroke="#e53935" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline points="525,300 525,190 520,190" fill="none" stroke="#1e88e5" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><rect x="570" y="140" width="60" height="60" rx="4" fill="#fafafa" stroke="#1d1d1b" stroke-width="2"/><line x1="585" y1="144" x2="585" y2="196" stroke="#1d1d1b" stroke-width="1.2"/><line x1="600" y1="144" x2="600" y2="196" stroke="#1d1d1b" stroke-width="1.2"/><line x1="615" y1="144" x2="615" y2="196" stroke="#1d1d1b" stroke-width="1.2"/><polyline points="575,250 575,160 570,160" fill="none" stroke="#e53935" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline points="635,300 635,190 630,190" fill="none" stroke="#1e88e5" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><rect x="680" y="140" width="60" height="60" rx="4" fill="#fafafa" stroke="#1d1d1b" stroke-width="2"/><line x1="695" y1="144" x2="695" y2="196" stroke="#1d1d1b" stroke-width="1.2"/><line x1="710" y1="144" x2="710" y2="196" stroke="#1d1d1b" stroke-width="1.2"/><line x1="725" y1="144" x2="725" y2="196" stroke="#1d1d1b" stroke-width="1.2"/><polyline points="685,250 685,160 680,160" fill="none" stroke="#e53935" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline points="745,300 745,190 740,190" fill="none" stroke="#1e88e5" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="430" y="370" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">+ все радиаторы одинаково горячие</text><text x="430" y="387" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">+ термоголовка на каждом</text><text x="430" y="404" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">− труб вдвое больше</text><line x1="560" y1="430" x2="590" y2="430" stroke="#e53935" stroke-width="5" stroke-linecap="round"/><text x="600" y="435" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">подача</text><line x1="560" y1="452" x2="590" y2="452" stroke="#1e88e5" stroke-width="5" stroke-linecap="round"/><text x="600" y="457" font-size="13" font-weight="400" text-anchor="start" fill="#1d1d1b">обратка</text></svg>