<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Щит без ошибок</title>
  <script>
    /* автообновление: если на сервере версия новее, перезагружаемся мимо кэша Telegram */
    window.APP_VERSION = 2;
    fetch("version.json?t=" + Date.now(), { cache: "no-store" }).then((r) => r.json()).then((j) => {
      if (j.v > window.APP_VERSION && !location.search.includes("v=" + j.v)) location.replace(location.pathname + "?v=" + j.v + location.hash);
    }).catch(() => {});
  </script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <header class="top">
    <button class="project-chip" id="projectChip" type="button">
      <span class="chip-label">Объект</span>
      <span class="chip-name" id="projectName">—</span>
    </button>
    <span class="badge" id="accessBadge">бесплатно</span>
  </header>

  <main id="view"></main>

  <nav class="tabs" id="tabs">
    <button data-tab="object" type="button"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7M5 10v10h14V10"/></svg>Объект</button>
    <button data-tab="lines" type="button"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/><circle cx="19" cy="18" r="2"/></svg>Линии</button>
    <button data-tab="shield" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M7 10v5M10 10v5M13 10v5M16 10v5"/></svg>Щит</button>
    <button data-tab="buy" type="button"><svg viewBox="0 0 24 24"><path d="M4 5h2l2 11h11l2-8H7"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>Закупка</button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="config.js?v=2"></script>
  <script src="core.js?v=2"></script>
  <script src="plan.js?v=2"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
